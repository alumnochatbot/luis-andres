<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Subway Surfers - Subway City 3D</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Rubik:ital,wght@0,700;0,900;1,900&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0f172a;
      font-family: 'Rubik', sans-serif;
    }
    #game-container {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    .font-arcade {
      font-family: 'Bungee', 'Rubik', sans-serif;
    }
    .text-stroke-dark {
      text-shadow:
        -2px -2px 0 #090d16,
         2px -2px 0 #090d16,
        -2px  2px 0 #090d16,
         2px  2px 0 #090d16,
         0px  4px 0 #090d16;
    }
    .text-stroke-sm {
      text-shadow:
        -1.5px -1.5px 0 #090d16,
         1.5px -1.5px 0 #090d16,
        -1.5px  1.5px 0 #090d16,
         1.5px  1.5px 0 #090d16,
         0px    2.5px 0 #090d16;
    }
    .btn-arcade {
      transition: transform 0.1s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.15s ease;
      box-shadow: 0 6px 0 #090d16, 0 10px 20px rgba(0, 0, 0, 0.45);
    }
    .btn-arcade:active {
      transform: translateY(4px) scale(0.97);
      box-shadow: 0 2px 0 #090d16, 0 4px 10px rgba(0, 0, 0, 0.45);
    }
    /* Destello radial estilo cómic al recoger Power-Up de rayo */
    #comic-burst {
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.25s ease-out;
      z-index: 15;
      background: repeating-conic-gradient(
        from 0deg at 50% 55%,
        rgba(56, 189, 248, 0.55) 0deg 10deg,
        transparent 10deg 22deg,
        rgba(254, 240, 138, 0.6) 22deg 32deg,
        transparent 32deg 45deg
      );
      -webkit-mask-image: radial-gradient(circle at 50% 55%, transparent 28%, black 68%);
      mask-image: radial-gradient(circle at 50% 55%, transparent 28%, black 68%);
    }
    #comic-burst.active {
      opacity: 1;
      animation: burstPulse 0.45s ease-out;
    }
    @keyframes burstPulse {
      0% { transform: scale(0.75) rotate(0deg); opacity: 1; }
      60% { transform: scale(1.08) rotate(8deg); opacity: 0.95; }
      100% { transform: scale(1.2) rotate(12deg); opacity: 0; }
    }
    /* Destello rojo al tropezar o chocar */
    #damage-flash {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(circle, transparent 40%, rgba(239, 68, 68, 0.65) 100%);
      opacity: 0;
      transition: opacity 0.2s ease-out;
      z-index: 16;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <!-- Efectos visuales de pantalla -->
    <div id="comic-burst"></div>
    <div id="damage-flash"></div>

    <!-- HUD EN PARTIDA (Fiel a image_6aaf25.png) -->
    <div id="hud" class="hidden absolute top-0 left-0 right-0 z-20 p-3 sm:p-5 flex items-start justify-between pointer-events-none">
      <!-- Superior Izquierda: Botón amarillo de Pausa -->
      <button id="btn-pause" aria-label="Pausar juego"
        class="pointer-events-auto btn-arcade w-12 h-12 sm:w-14 sm:h-14 rounded-2xl bg-gradient-to-b from-yellow-300 via-yellow-400 to-amber-500 border-[3px] border-slate-950 flex items-center justify-center cursor-pointer hover:brightness-105">
        <div class="flex gap-1.5">
          <span class="w-2 h-6 bg-slate-950 rounded-sm"></span>
          <span class="w-2 h-6 bg-slate-950 rounded-sm"></span>
        </div>
      </button>

      <!-- Superior Centro: Multiplicador verde + Puntuación y Barra de Power-Up -->
      <div class="flex flex-col items-center gap-2">
        <div class="flex items-center bg-slate-900/85 backdrop-blur-md border-[3px] border-slate-950 rounded-2xl px-3.5 py-1.5 sm:px-5 sm:py-2 shadow-xl">
          <span id="hud-multiplier"
            class="font-arcade text-xl sm:text-2xl text-lime-400 text-stroke-sm mr-3 sm:mr-4 transform -rotate-6 inline-block">
            x1
          </span>
          <span id="hud-score"
            class="font-arcade text-2xl sm:text-3xl text-white tracking-wider text-stroke-sm">
            000000
          </span>
        </div>

        <!-- Barra de Power-Up Rayo Azul -->
        <div id="powerup-bar-wrap" class="hidden flex items-center gap-2 bg-slate-900/90 border-2 border-sky-400 rounded-full px-3 py-1 shadow-lg shadow-sky-500/30">
          <svg class="w-4 h-4 text-sky-300 animate-pulse" viewBox="0 0 24 24" fill="currentColor">
            <path d="M13 2L3 14h7l-1 8 10-12h-7l1-8z"/>
          </svg>
          <div class="w-28 sm:w-36 h-2.5 bg-slate-800 rounded-full overflow-hidden border border-slate-700">
            <div id="powerup-bar-fill" class="h-full bg-gradient-to-r from-sky-400 via-cyan-300 to-blue-500 w-full transition-all duration-75"></div>
          </div>
          <span class="text-[11px] font-black text-sky-300 uppercase tracking-wider">TURBO</span>
        </div>
      </div>

      <!-- Superior Derecha: Contador de Monedas -->
      <div class="flex items-center gap-2 bg-slate-900/85 backdrop-blur-md border-[3px] border-slate-950 rounded-2xl px-3 py-1.5 sm:px-4 sm:py-2 shadow-xl">
        <div class="w-7 h-7 sm:w-8 sm:h-8 rounded-full bg-gradient-to-tr from-amber-500 via-yellow-400 to-yellow-200 border-2 border-amber-700 flex items-center justify-center shadow-inner">
          <svg class="w-4 h-4 text-amber-700" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 2l2.9 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l7.1-1.01L12 2z"/>
          </svg>
        </div>
        <span id="hud-coins" class="font-arcade text-xl sm:text-2xl text-yellow-300 text-stroke-sm">
          0
        </span>
      </div>
    </div>

    <!-- PANTALLA DE INICIO (Overlay sobre el mundo 3D vivo) -->
    <div id="screen-start" class="absolute inset-0 z-30 flex flex-col items-center justify-between p-5 sm:p-8 bg-gradient-to-b from-slate-950/60 via-slate-950/25 to-slate-950/75">
      <!-- Barra superior de estadísticas persistentes -->
      <div class="w-full max-w-lg flex items-center justify-between gap-3">
        <div class="bg-slate-900/90 border-2 border-slate-700 rounded-2xl px-3.5 py-2 flex items-center gap-2 shadow-lg">
          <span class="text-xs font-bold uppercase text-slate-400">Récord:</span>
          <span id="start-highscore" class="font-arcade text-base sm:text-lg text-lime-400">000000</span>
        </div>
        <div class="flex items-center gap-2">
          <div class="bg-slate-900/90 border-2 border-slate-700 rounded-2xl px-3.5 py-2 flex items-center gap-2 shadow-lg">
            <span class="w-4 h-4 rounded-full bg-yellow-400 border border-amber-700 inline-block"></span>
            <span id="start-totalcoins" class="font-arcade text-base sm:text-lg text-yellow-300">0</span>
          </div>
          <button id="btn-sound-start" aria-label="Alternar sonido"
            class="btn-arcade w-11 h-11 rounded-2xl bg-slate-800 border-2 border-slate-950 text-white flex items-center justify-center cursor-pointer">
            <svg id="icon-sound-on" class="w-5 h-5 text-sky-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
            </svg>
            <svg id="icon-sound-off" class="hidden w-5 h-5 text-rose-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <path d="M11 5L6 9H2v6h4l5 4V5z"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/>
            </svg>
          </button>
        </div>
      </div>

      <!-- Título Arcade Estilo Graffiti -->
      <div class="text-center my-auto transform -rotate-2">
        <div class="inline-block bg-emerald-800/95 border-4 border-slate-950 px-4 py-1 rounded-xl shadow-lg mb-2">
          <span class="font-arcade text-xs sm:text-sm tracking-widest text-emerald-200">EDICIÓN SUBWAY CITY</span>
        </div>
        <h1 class="font-arcade text-5xl sm:text-7xl md:text-8xl leading-none tracking-tight text-transparent bg-clip-text bg-gradient-to-b from-yellow-300 via-orange-400 to-red-500 drop-shadow-[0_6px_0_rgba(9,13,22,1)]">
          SUBWAY<br/>
          <span class="bg-clip-text text-transparent bg-gradient-to-b from-sky-300 via-blue-500 to-indigo-600">SURFERS</span>
        </h1>
      </div>

      <!-- Controles y Botón Jugar -->
      <div class="w-full max-w-md flex flex-col items-center gap-4">
        <div class="w-full grid grid-cols-3 gap-2 bg-slate-900/85 backdrop-blur-md border-2 border-slate-800 rounded-2xl p-3 text-center text-xs text-slate-200">
          <div class="flex flex-col items-center gap-1">
            <span class="px-2 py-1 rounded-lg bg-slate-800 border border-slate-600 font-bold text-sky-300">← / →</span>
            <span class="text-[11px] text-slate-300 font-semibold">Cambiar Carril</span>
          </div>
          <div class="flex flex-col items-center gap-1">
            <span class="px-2 py-1 rounded-lg bg-slate-800 border border-slate-600 font-bold text-lime-300">↑ / Espacio</span>
            <span class="text-[11px] text-slate-300 font-semibold">Saltar Trenes</span>
          </div>
          <div class="flex flex-col items-center gap-1">
            <span class="px-2 py-1 rounded-lg bg-slate-800 border border-slate-600 font-bold text-amber-300">↓ / Deslizar</span>
            <span class="text-[11px] text-slate-300 font-semibold">Rodar / Chispas</span>
          </div>
        </div>

        <button id="btn-play"
          class="btn-arcade w-full py-4 sm:py-5 rounded-3xl bg-gradient-to-b from-lime-400 via-green-500 to-emerald-600 border-4 border-slate-950 font-arcade text-2xl sm:text-3xl text-white text-stroke-sm tracking-wider cursor-pointer hover:brightness-105">
          ¡JUGAR AHORA!
        </button>
      </div>
    </div>

    <!-- MENÚ DE PAUSA -->
    <div id="screen-pause" class="hidden absolute inset-0 z-30 flex items-center justify-center p-5 bg-slate-950/75 backdrop-blur-sm">
      <div class="w-full max-w-sm bg-slate-900 border-4 border-slate-950 rounded-3xl p-6 text-center shadow-2xl">
        <h2 class="font-arcade text-3xl text-yellow-400 text-stroke-sm mb-6">JUEGO PAUSADO</h2>
        <div class="flex flex-col gap-3.5">
          <button id="btn-resume"
            class="btn-arcade w-full py-3.5 rounded-2xl bg-gradient-to-b from-lime-400 to-green-600 border-[3px] border-slate-950 font-arcade text-xl text-white text-stroke-sm cursor-pointer">
            CONTINUAR
          </button>
          <button id="btn-restart-pause"
            class="btn-arcade w-full py-3.5 rounded-2xl bg-gradient-to-b from-sky-400 to-blue-600 border-[3px] border-slate-950 font-arcade text-xl text-white text-stroke-sm cursor-pointer">
            REINICIAR
          </button>
          <button id="btn-sound-pause"
            class="btn-arcade w-full py-3 rounded-2xl bg-slate-800 border-[3px] border-slate-950 font-bold text-base text-slate-200 cursor-pointer">
            SONIDO: ACTIVADO
          </button>
        </div>
      </div>
    </div>

    <!-- PANTALLA DE FIN DE PARTIDA (GAME OVER) -->
    <div id="screen-gameover" class="hidden absolute inset-0 z-30 flex items-center justify-center p-5 bg-slate-950/80 backdrop-blur-md">
      <div class="w-full max-w-sm bg-slate-900 border-4 border-slate-950 rounded-3xl p-6 text-center shadow-2xl">
        <div id="new-record-badge" class="hidden inline-block bg-gradient-to-r from-amber-400 to-yellow-300 text-slate-950 font-arcade text-xs px-3 py-1 rounded-full mb-2 animate-bounce">
          ¡NUEVO RÉCORD!
        </div>
        <h2 class="font-arcade text-3xl sm:text-4xl text-rose-500 text-stroke-sm mb-5">¡FIN DE LA CARRERA!</h2>

        <div class="bg-slate-950/80 border-2 border-slate-800 rounded-2xl p-4 mb-6 flex flex-col gap-3">
          <div class="flex justify-between items-center border-b border-slate-800 pb-2">
            <span class="text-slate-400 font-bold text-sm uppercase">Puntuación</span>
            <span id="go-score" class="font-arcade text-2xl text-white">000000</span>
          </div>
          <div class="flex justify-between items-center border-b border-slate-800 pb-2">
            <span class="text-slate-400 font-bold text-sm uppercase">Mejor Récord</span>
            <span id="go-highscore" class="font-arcade text-xl text-lime-400">000000</span>
          </div>
          <div class="flex justify-between items-center">
            <span class="text-slate-400 font-bold text-sm uppercase">Monedas Recogidas</span>
            <span id="go-coins" class="font-arcade text-xl text-yellow-300">+0</span>
          </div>
        </div>

        <button id="btn-restart"
          class="btn-arcade w-full py-4 rounded-2xl bg-gradient-to-b from-yellow-300 via-amber-400 to-orange-500 border-4 border-slate-950 font-arcade text-2xl text-slate-950 cursor-pointer hover:brightness-105">
          JUGAR DE NUEVO
        </button>
      </div>
    </div>
  </div>

  <script>
    /**
     * =========================================================================
     * SUBWAY SURFERS - SUBWAY CITY 3D
     * Motor 3D con Three.js, texturas procedurales Canvas 2D y audio Web Audio API
     * =========================================================================
     */

    // -------------------------------------------------------------------------
    // 1. SISTEMA DE AUDIO PROCEDURAL (WEB AUDIO API)
    // -------------------------------------------------------------------------
    class SoundEngine {
      constructor() {
        this.ctx = null;
        this.enabled = true;
      }

      init() {
        if (!this.ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) {
            this.ctx = new AudioCtx();
          }
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      toggle() {
        this.enabled = !this.enabled;
        return this.enabled;
      }

      playCoin() {
        if (!this.enabled) return;
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(987.77, now); // B5
        osc.frequency.setValueAtTime(1318.51, now + 0.06); // E6
        gain.gain.setValueAtTime(0.18, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.26);
      }

      playJump() {
        if (!this.enabled) return;
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(220, now);
        osc.frequency.exponentialRampToValueAtTime(580, now + 0.18);
        gain.gain.setValueAtTime(0.22, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.21);
      }

      playSlide() {
        if (!this.enabled) return;
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(340, now);
        osc.frequency.exponentialRampToValueAtTime(110, now + 0.22);
        gain.gain.setValueAtTime(0.14, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.23);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.24);
      }

      playLane() {
        if (!this.enabled) return;
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(320, now);
        osc.frequency.exponentialRampToValueAtTime(480, now + 0.09);
        gain.gain.setValueAtTime(0.14, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.11);
      }

      playPowerUp() {
        if (!this.enabled) return;
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const freqs = [523.25, 659.25, 783.99, 1046.50];
        freqs.forEach((f, idx) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'square';
          osc.frequency.setValueAtTime(f, now + idx * 0.055);
          gain.gain.setValueAtTime(0.13, now + idx * 0.055);
          gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.055 + 0.22);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now + idx * 0.055);
          osc.stop(now + idx * 0.055 + 0.23);
        });
      }

      playCrash() {
        if (!this.enabled) return;
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(150, now);
        osc.frequency.exponentialRampToValueAtTime(38, now + 0.42);
        gain.gain.setValueAtTime(0.32, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.45);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.46);
      }
    }

    // -------------------------------------------------------------------------
    // 2. GENERADOR DE TEXTURAS PROCEDURALES (CANVAS 2D -> THREE.CANVASTEXTURE)
    // -------------------------------------------------------------------------
    const TextureFactory = {
      createSignTexture() {
        const c = document.createElement('canvas');
        c.width = 1024;
        c.height = 256;
        const ctx = c.getContext('2d');

        // Fondo verde urbano desgastado fiel a image_6aaf25.png y watermarked_img
        ctx.fillStyle = '#244c3c';
        ctx.fillRect(0, 0, c.width, c.height);

        // Borde metálico envejecido
        ctx.strokeStyle = '#9ca3af';
        ctx.lineWidth = 22;
        ctx.strokeRect(11, 11, c.width - 22, c.height - 22);

        // Manchas sutiles de óxido y desgaste
        for (let i = 0; i < 45; i++) {
          ctx.fillStyle = i % 2 === 0 ? 'rgba(180, 83, 9, 0.16)' : 'rgba(255, 255, 255, 0.06)';
          ctx.beginPath();
          ctx.arc(Math.random() * c.width, Math.random() * c.height, 8 + Math.random() * 28, 0, Math.PI * 2);
          ctx.fill();
        }

        // Texto SUBWAY CITY
        ctx.fillStyle = '#e2e8f0';
        ctx.font = '900 112px "Bungee", "Rubik", sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.shadowColor = 'rgba(0,0,0,0.65)';
        ctx.shadowBlur = 8;
        ctx.shadowOffsetY = 5;
        ctx.fillText('SUBWAY CITY', c.width / 2, c.height / 2 + 6);

        return new THREE.CanvasTexture(c);
      },

      createArrowSignTexture() {
        const c = document.createElement('canvas');
        c.width = 256;
        c.height = 256;
        const ctx = c.getContext('2d');

        ctx.fillStyle = '#244c3c';
        ctx.fillRect(0, 0, 256, 256);
        ctx.strokeStyle = '#9ca3af';
        ctx.lineWidth = 18;
        ctx.strokeRect(9, 9, 238, 238);

        // Flecha diagonal blanca apuntando abajo-izquierda (como en la referencia)
        ctx.save();
        ctx.translate(128, 128);
        ctx.rotate((3 * Math.PI) / 4);
        ctx.fillStyle = '#f1f5f9';
        ctx.beginPath();
        ctx.moveTo(55, 0);
        ctx.lineTo(5, -45);
        ctx.lineTo(5, -20);
        ctx.lineTo(-55, -20);
        ctx.lineTo(-55, 20);
        ctx.lineTo(5, 20);
        ctx.lineTo(5, 45);
        ctx.closePath();
        ctx.fill();
        ctx.restore();

        return new THREE.CanvasTexture(c);
      },

      createGraffitiWallTexture() {
        const c = document.createElement('canvas');
        c.width = 1024;
        c.height = 512;
        const ctx = c.getContext('2d');

        // Muro de concreto oscuro del túnel
        ctx.fillStyle = '#26303d';
        ctx.fillRect(0, 0, c.width, c.height);

        // Bloques y textura de concreto
        ctx.strokeStyle = 'rgba(15, 23, 42, 0.45)';
        ctx.lineWidth = 4;
        for (let y = 0; y < c.height; y += 64) {
          ctx.beginPath();
          ctx.moveTo(0, y);
          ctx.lineTo(c.width, y);
          ctx.stroke();
        }
        for (let i = 0; i < 120; i++) {
          ctx.fillStyle = 'rgba(148, 163, 184, 0.04)';
          ctx.fillRect(Math.random() * c.width, Math.random() * c.height, 20 + Math.random() * 60, 10 + Math.random() * 30);
        }

        // Graffiti 1: "LEVEL UP!"
        ctx.save();
        ctx.translate(270, 175);
        ctx.rotate(-0.08);
        ctx.font = '900 78px "Bungee", sans-serif';
        ctx.textAlign = 'center';
        ctx.lineWidth = 14;
        ctx.strokeStyle = '#090d16';
        ctx.strokeText('LEVEL UP!', 0, 0);
        const grad1 = ctx.createLinearGradient(-150, -40, 150, 40);
        grad1.addColorStop(0, '#facc15');
        grad1.addColorStop(1, '#fb7185');
        ctx.fillStyle = grad1;
        ctx.fillText('LEVEL UP!', 0, 0);
        ctx.restore();

        // Graffiti 2: "POWER UP!"
        ctx.save();
        ctx.translate(760, 190);
        ctx.rotate(0.07);
        ctx.font = '900 74px "Bungee", sans-serif';
        ctx.textAlign = 'center';
        ctx.lineWidth = 14;
        ctx.strokeStyle = '#090d16';
        ctx.strokeText('POWER UP!', 0, 0);
        const grad2 = ctx.createLinearGradient(-150, -40, 150, 40);
        grad2.addColorStop(0, '#38bdf8');
        grad2.addColorStop(1, '#4ade80');
        ctx.fillStyle = grad2;
        ctx.fillText('POWER UP!', 0, 0);
        ctx.restore();

        // Graffiti 3: "JAKE LIVES 88" & "NYC!"
        ctx.save();
        ctx.translate(512, 375);
        ctx.font = '900 44px "Bungee", sans-serif';
        ctx.textAlign = 'center';
        ctx.fillStyle = 'rgba(226, 232, 240, 0.55)';
        ctx.fillText('JAKE LIVES 88   •   NYC!', 0, 0);

        const tex = new THREE.CanvasTexture(c);

      createBarrierXTexture() {
        const c = document.createElement('canvas');
        c.width = 512;
        c.height = 512;
        const ctx = c.getContext('2d');

        // Panel rojo señalización
        ctx.fillStyle = '#dc2626';
        ctx.fillRect(0, 0, 512, 512);

        // Franja superior de advertencia roja y blanca
        const stripeW = 64;
        for (let x = 0; x < 512; x += stripeW) {
          ctx.fillStyle = (x / stripeW) % 2 === 0 ? '#f8fafc' : '#b91c1c';
          ctx.fillRect(x, 0, stripeW, 95);
        }

        // Gran aspa blanca "X" central (fiel a image_6aaf25.png)
        ctx.strokeStyle = '#f8fafc';
        ctx.lineWidth = 68;
        ctx.lineCap = 'butt';
        ctx.beginPath();
        ctx.moveTo(110, 155);
        ctx.lineTo(402, 445);
        ctx.moveTo(402, 155);
        ctx.lineTo(110, 445);
        ctx.stroke();

        // Borde metálico oscuro
        ctx.strokeStyle = '#1e293b';
        ctx.lineWidth = 20;
        ctx.strokeRect(10, 10, 492, 492);

        return new THREE.CanvasTexture(c);
      },

      createHighBarrierTexture() {
        const c = document.createElement('canvas');
        c.width = 512;
        c.height = 128;
        const ctx = c.getContext('2d');

        ctx.fillStyle = '#f8fafc';
        ctx.fillRect(0, 0, 512, 128);

        // Franjas diagonales rojas y blancas (como en video_1.mp4 00:06)
        ctx.fillStyle = '#dc2626';
        for (let x = -128; x < 640; x += 96) {
          ctx.beginPath();
          ctx.moveTo(x, 0);
          ctx.lineTo(x + 48, 0);
          ctx.lineTo(x + 96, 128);
          ctx.lineTo(x + 48, 128);
          ctx.closePath();
          ctx.fill();
        }

        ctx.strokeStyle = '#0f172a';
        ctx.lineWidth = 12;
        ctx.strokeRect(6, 6, 500, 116);

      createTrainFrontTexture(primaryColor = '#e2e8f0') {
        const c = document.createElement('canvas');

        c.height = 512;
        const ctx = c.getContext('2d');

        // Cuerpo frontal
        ctx.fillStyle = primaryColor;

        ctx.fillStyle = '#0f172a';

        ctx.font = '900 28px "Bungee", sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('SUBWAY EXPRESS', 256, 70);

        // Parabrisas divididos con puerta central
        ctx.fillStyle = '#1e293b';
        ctx.fillRect(44, 108, 130, 165);
        ctx.fillRect(338, 108, 130, 165);

        // Puerta central de cabina
        ctx.fillStyle = '#64748b';
        ctx.fillRect(194, 108, 124, 285);
        ctx.fillStyle = '#0f172a';

        // Faldón inferior rojo y blanco (fiel a image_6aaf25.png)
        ctx.fillStyle = '#dc2626';

        ctx.fillStyle = '#f8fafc';
        ctx.beginPath();
        ctx.arc(256, 452, 34, 0, Math.PI * 2);

      createTrainSideTexture(bodyColor = '#cbd5e1', stripeColor = '#2563eb') {
        const c = document.createElement('canvas');
        c.width = 1024;
        c.height = 256;
        const ctx = c.getContext('2d');

        ctx.fillStyle = bodyColor;
        ctx.fillRect(0, 0, 1024, 256);

        // Franja decorativa lateral
        ctx.fillStyle = stripeColor;
        ctx.fillRect(0, 148, 1024, 34);
        ctx.fillStyle = '#dc2626';
        ctx.fillRect(0, 210, 1024, 46);

        // Ventanas y puertas
        for (let x = 48; x < 960; x += 160) {
          ctx.fillStyle = '#1e293b';

      createCoinTexture() {
        const c = document.createElement('canvas');
        c.width = 256;
        c.height = 256;
        const ctx = c.getContext('2d');

        const grad = ctx.createRadialGradient(100, 90, 20, 128, 128, 125);
        grad.addColorStop(0, '#fef08a');
        grad.addColorStop(0.6, '#facc15');
        grad.addColorStop(1, '#d97706');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(128, 128, 122, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = '#b45309';
        ctx.lineWidth = 16;
        ctx.beginPath();
        ctx.arc(128, 128, 104, 0, Math.PI * 2);
        ctx.stroke();

        // Estrella central en relieve
        ctx.fillStyle = '#fde047';
        ctx.strokeStyle = '#92400e';
        ctx.lineWidth = 8;
        ctx.beginPath();
        const spikes = 5;
        const outerR = 66;
        const innerR = 30;
        for (let i = 0; i < spikes * 2; i++) {
          const r = i % 2 === 0 ? outerR : innerR;
          const angle = (i * Math.PI) / spikes - Math.PI / 2;
          const x = 128 + Math.cos(angle) * r;
          const y = 128 + Math.sin(angle) * r;
          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        return new THREE.CanvasTexture(c);
      },

      createLightningTokenTexture() {
        const c = document.createElement('canvas');
        c.width = 256;
        c.height = 256;
        const ctx = c.getContext('2d');

        const grad = ctx.createRadialGradient(128, 128, 15, 128, 128, 120);
        grad.addColorStop(0, '#e0f2fe');
        grad.addColorStop(0.5, '#0ea5e9');
        grad.addColorStop(1, '#0369a1');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(128, 128, 118, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = '#7dd3fc';
        ctx.lineWidth = 14;
        ctx.beginPath();
        ctx.arc(128, 128, 102, 0, Math.PI * 2);
        ctx.stroke();

        // Rayo luminoso central
        ctx.fillStyle = '#ffffff';
        ctx.shadowColor = '#38bdf8';
        ctx.shadowBlur = 18;
        ctx.beginPath();
        ctx.moveTo(142, 46);
        ctx.lineTo(82, 136);
        ctx.lineTo(126, 136);
        ctx.lineTo(110, 212);
        ctx.lineTo(176, 118);
        ctx.lineTo(132, 118);
        ctx.closePath();
        ctx.fill();

        return new THREE.CanvasTexture(c);
      },

      createTrackBedTexture() {
        const c = document.createElement('canvas');
        c.width = 512;
        c.height = 512;
        const ctx = c.getContext('2d');

        // Balasto oscuro
        ctx.fillStyle = '#3b2f26';
        ctx.fillRect(0, 0, 512, 512);

        // Piedras del balasto
        for (let i = 0; i < 650; i++) {
          ctx.fillStyle = i % 3 === 0 ? '#524236' : (i % 3 === 1 ? '#29201a' : '#6b5848');
          ctx.fillRect(Math.random() * 512, Math.random() * 512, 6, 6);
        }

        // Durmientes de madera para los 3 carriles
        const laneCenters = [106, 256, 406];
        ctx.fillStyle = '#5c3a21';
        for (let y = 16; y < 512; y += 64) {
          laneCenters.forEach(cx => {
            ctx.fillRect(cx - 56, y, 112, 24);
            ctx.fillStyle = '#3e2513';
            ctx.fillRect(cx - 56, y + 18, 112, 6);
            ctx.fillStyle = '#5c3a21';
          });
        }

        // Rieles metálicos brillantes (2 por carril)
        laneCenters.forEach(cx => {
          [-34, 34].forEach(offset => {
            ctx.fillStyle = '#64748b';
            ctx.fillRect(cx + offset - 5, 0, 10, 512);
            ctx.fillStyle = '#e2e8f0';
            ctx.fillRect(cx + offset - 2, 0, 4, 512);
          });
        });

        const tex = new THREE.CanvasTexture(c);
        tex.wrapS = THREE.RepeatWrapping;
        tex.wrapT = THREE.RepeatWrapping;
        tex.repeat.set(1, 6);
        return tex;
      }
    };

    // -------------------------------------------------------------------------
    // 3. CLASE PRINCIPAL DEL VIDEOJUEGO 3D
    // -------------------------------------------------------------------------
    class SubwaySurfersGame {
      constructor() {
        this.container = document.getElementById('game-container');
        this.sound = new SoundEngine();

        // Constantes de física y carriles
        this.LANE_WIDTH = 3.2;
        this.LANES = [-this.LANE_WIDTH, 0, this.LANE_WIDTH];
        this.TRAIN_HEIGHT = 2.85;
        this.GRAVITY = -48;
        this.JUMP_FORCE = 19.5;

        // Estado persistente
        this.highScore = parseInt(localStorage.getItem('ss_highScore') || '0', 10);
        this.totalCoins = parseInt(localStorage.getItem('ss_totalCoins') || '0', 10);

        // Estado de partida
        this.state = 'START'; // START, PLAYING, PAUSED, GAMEOVER
        this.score = 0;
        this.coins = 0;
        this.multiplier = 1;
        this.distance = 0;
        this.baseSpeed = 24;
        this.currentSpeed = 24;
        this.powerUpTimer = 0;
        this.POWERUP_DURATION = 8.0;
        this.invulnerableTimer = 0;

        // Estado del jugador
        this.currentLane = 1; // 0: izq, 1: centro, 2: der
        this.playerX = 0;
        this.playerY = 0;
        this.velocityY = 0;
        this.groundY = 0;
        this.isJumping = false;
        this.isSliding = false;
        this.slideTimer = 0;
        this.runCycle = 0;
        this.cameraShake = 0;

        // Pools / Colecciones de mundo
        this.obstacles = [];
        this.collectibles = [];
        this.worldSegments = [];
        this.particles = [];
        this.nextSpawnZ = -35;
        this.segmentCounter = 0;

        this.initThree();
        this.initMaterials();
        this.createPlayer();
        this.createInitialWorld();
        this.bindEvents();
        this.updateStartUI();

        this.lastTime = performance.now();
        this.animate = this.animate.bind(this);
        requestAnimationFrame(this.animate);
      }

      initThree() {
        this.scene = new THREE.Scene();
        this.scene.background = new THREE.Color(0x38bdf8);
        this.scene.fog = new THREE.FogExp2(0x7dd3fc, 0.011);

        const width = this.container.clientWidth || window.innerWidth;
        const height = this.container.clientHeight || window.innerHeight;

        this.camera = new THREE.PerspectiveCamera(62, width / height, 0.1, 180);
        this.camera.position.set(0, 5.4, 8.2);
        this.camera.lookAt(0, 2.0, -10);

        this.renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
        this.renderer.setSize(width, height);
        this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        this.renderer.shadowMap.enabled = true;
        this.renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        this.container.insertBefore(this.renderer.domElement, this.container.firstChild);

        // Iluminación
        const hemiLight = new THREE.HemisphereLight(0xe0f2fe, 0x334155, 0.95);
        hemiLight.position.set(0, 30, 0);
        this.scene.add(hemiLight);

        this.dirLight = new THREE.DirectionalLight(0xfffbeb, 1.05);
        this.dirLight.position.set(14, 28, 16);
        this.dirLight.castShadow = true;
        this.dirLight.shadow.mapSize.width = 1024;
        this.dirLight.shadow.mapSize.height = 1024;
        this.dirLight.shadow.camera.near = 2;
        this.dirLight.shadow.camera.far = 90;
        const d = 22;
        this.dirLight.shadow.camera.left = -d;
        this.dirLight.shadow.camera.right = d;
        this.dirLight.shadow.camera.top = d;
        this.dirLight.shadow.camera.bottom = -d;
        this.scene.add(this.dirLight);
      }

      /**
       * Construye el protagonista 3D articulado fiel a las referencias:
       * Gorra blanca con visera roja, sudadera crema, chaleco azul de mezclilla,
       * mochila con parche amarillo/azul, jeans ajustados y zapatillas blancas/verdes.

      createPlayer() {
        this.playerGroup = new THREE.Group();

        const hoodieMat = new THREE.MeshStandardMaterial({ color: 0xfef3c7, roughness: 0.75 }); // Sudadera crema
        const vestMat = new THREE.MeshStandardMaterial({ color: 0x2563eb, roughness: 0.65 });   // Chaleco mezclilla azul
        const jeansMat = new THREE.MeshStandardMaterial({ color: 0x3b82f6, roughness: 0.7 });   // Jeans azul
        const capWhiteMat = new THREE.MeshStandardMaterial({ color: 0xf8fafc, roughness: 0.5 }); // Gorra blanca
        const capRedMat = new THREE.MeshStandardMaterial({ color: 0xdc2626, roughness: 0.5 });   // Visera roja
        const shoeWhiteMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.4 });
        const shoeGreenMat = new THREE.MeshStandardMaterial({ color: 0x22c55e, roughness: 0.5 });

        // Contenedor interno para inclinaciones y agacharse
        this.playerBody = new THREE.Group();
        this.playerGroup.add(this.playerBody);

        // Torso (sudadera + chaleco)
        const torso = new THREE.Mesh(new THREE.BoxGeometry(0.68, 0.82, 0.42), vestMat);
        torso.position.y = 1.25;
        torso.castShadow = true;
        this.playerBody.add(torso);

        // Mochila urbana trasera con etiqueta amarilla/azul (vista en video_1.mp4)
        const backpack = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.56, 0.24), new THREE.MeshStandardMaterial({ color: 0x1d4ed8 }));
        backpack.position.set(0, 1.28, 0.28);
        backpack.castShadow = true;
        this.playerBody.add(backpack);

        const patch = new THREE.Mesh(new THREE.BoxGeometry(0.26, 0.2, 0.04), new THREE.MeshStandardMaterial({ color: 0xfacc15, emissive: 0xca8a04, emissiveIntensity: 0.2 }));
        patch.position.set(0, 1.32, 0.41);
        this.playerBody.add(patch);

        // Cabeza + Gorra blanca con visera roja
        this.headGroup = new THREE.Group();
        this.headGroup.position.set(0, 1.92, 0);
        const head = new THREE.Mesh(new THREE.SphereGeometry(0.32, 16, 16), skinMat);
        head.castShadow = true;
        this.headGroup.add(head);

        const capCrown = new THREE.Mesh(new THREE.SphereGeometry(0.34, 16, 12, 0, Math.PI * 2, 0, Math.PI * 0.58), capWhiteMat);
        capCrown.position.y = 0.03;
        this.headGroup.add(capCrown);

        const capVisor = new THREE.Mesh(new THREE.BoxGeometry(0.42, 0.06, 0.28), capRedMat);
        capVisor.position.set(0, 0.06, -0.32);
        capVisor.rotation.x = 0.15;
        this.headGroup.add(capVisor);

        const capButton = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 0.05, 12), new THREE.MeshStandardMaterial({ color: 0xfacc15 }));
        capButton.position.y = 0.37;
        this.headGroup.add(capButton);

        this.playerBody.add(this.headGroup);

        // Brazos (mangas crema + manos)
        this.leftArm = new THREE.Group();
        this.leftArm.position.set(-0.46, 1.56, 0);

        lArmMesh.position.y = -0.28;
        lArmMesh.castShadow = true;

      /**
       * Construye segmentos modulares del entorno infinito:
       * Alterna tramos exteriores con pórtico "SUBWAY CITY" y tramos de túnel con graffitis.
       */
      createInitialWorld() {
        // Suelo continuo de vías férreas (3 carriles)
        const groundGeo = new THREE.PlaneGeometry(13.5, 240);
        const groundMesh = new THREE.Mesh(groundGeo, this.mats.track);
        groundMesh.rotation.x = -Math.PI / 2;
        groundMesh.position.set(0, 0, -90);
        groundMesh.receiveShadow = true;
        this.groundMesh = groundMesh;
        this.scene.add(groundMesh);

        // Muros bajos laterales de contención
        const wallMat = new THREE.MeshStandardMaterial({ color: 0x475569, roughness: 0.85 });
        [-7.2, 7.2].forEach(x => {
          const wall = new THREE.Mesh(new THREE.BoxGeometry(1.0, 2.2, 240), wallMat);
          wall.position.set(x, 1.1, -90);
          wall.receiveShadow = true;
          this.scene.add(wall);
        });

        // Generar primeros 7 segmentos del escenario
        for (let i = 0; i < 7; i++) {
          this.spawnWorldSegment(-i * 30);
        }

        // Generar patrones iniciales de obstáculos y monedas
        this.nextSpawnZ = -28;
        for (let i = 0; i < 6; i++) {
          this.spawnPattern();
        }
      }

      spawnWorldSegment(zPos) {
        const segGroup = new THREE.Group();
        segGroup.position.z = zPos;
        const idx = this.segmentCounter++;

        // Cada 4 segmentos: Túnel subterráneo con luces fluorescentes y graffitis
        const isTunnel = (idx % 4 === 2);

        if (isTunnel) {
          // Paredes internas del túnel con graffitis ("LEVEL UP!", "POWER UP!")
          const wallGeo = new THREE.PlaneGeometry(30, 8.5);
          const leftWall = new THREE.Mesh(wallGeo, this.mats.graffitiWall);
          leftWall.position.set(-6.65, 4.25, 0);
          leftWall.rotation.y = Math.PI / 2;
          segGroup.add(leftWall);

          const rightWall = new THREE.Mesh(wallGeo, this.mats.graffitiWall);
          rightWall.position.set(6.65, 4.25, 0);
          rightWall.rotation.y = -Math.PI / 2;
          segGroup.add(rightWall);

          // Techo del túnel
          const roof = new THREE.Mesh(new THREE.BoxGeometry(14.6, 1.2, 30), this.mats.tunnelRoof);
          roof.position.set(0, 8.8, 0);
          segGroup.add(roof);

          // Portal frontal del túnel
          const portalTop = new THREE.Mesh(new THREE.BoxGeometry(14.8, 2.4, 1.2), this.mats.graffitiWall);
          portalTop.position.set(0, 7.4, 14.4);
          segGroup.add(portalTop);

          // Luces fluorescentes en el techo del túnel
          const lightMat = new THREE.MeshBasicMaterial({ color: 0xe0f2fe });
          [-8, 6].forEach(lz => {
            const tube = new THREE.Mesh(new THREE.BoxGeometry(3.8, 0.15, 0.35), lightMat);
            tube.position.set(0, 8.1, lz);
            segGroup.add(tube);
          });
        } else {
          // Tramo exterior urbano: Edificios y árboles verdes
          const buildingColors = [0x64748b, 0x94a3b8, 0xb45309, 0x475569];
          [-12.5, 12.5].forEach((bx, sideIdx) => {
            const h = 14 + ((idx + sideIdx) % 3) * 5;
            const bMat = new THREE.MeshStandardMaterial({
              color: buildingColors[(idx + sideIdx) % buildingColors.length],
              roughness: 0.8
            });
            const building = new THREE.Mesh(new THREE.BoxGeometry(8, h, 24), bMat);
            building.position.set(bx, h / 2, 0);
            segGroup.add(building);

            // Árbol urbano frondoso sobre el muro
            const foliage = new THREE.Mesh(
              new THREE.DodecahedronGeometry(2.3, 1),
              new THREE.MeshStandardMaterial({ color: 0x22c55e, roughness: 0.75 })
            );
            foliage.position.set(bx > 0 ? 7.6 : -7.6, 3.6, 4);
            segGroup.add(foliage);
          });

          // Cada 4 segmentos: Pórtico metálico elevado con letrero "SUBWAY CITY" + flecha
          if (idx % 4 === 1) {
            const beamMat = new THREE.MeshStandardMaterial({ color: 0x334155, metalness: 0.5, roughness: 0.5 });
            const leftPost = new THREE.Mesh(new THREE.BoxGeometry(0.45, 7.5, 0.45), beamMat);
            leftPost.position.set(-6.5, 3.75, 0);
            const rightPost = new THREE.Mesh(new THREE.BoxGeometry(0.45, 7.5, 0.45), beamMat);
            rightPost.position.set(6.5, 3.75, 0);
            const crossBeam = new THREE.Mesh(new THREE.BoxGeometry(13.6, 0.45, 0.45), beamMat);
            crossBeam.position.set(0, 7.1, 0);
            segGroup.add(leftPost, rightPost, crossBeam);

            // Cartel principal "SUBWAY CITY"
            const signBoard = new THREE.Mesh(
              new THREE.BoxGeometry(7.2, 1.85, 0.25),
              new THREE.MeshStandardMaterial({ map: this.tex.sign, roughness: 0.6 })
            );
            signBoard.position.set(-1.1, 7.1, 0.22);
            segGroup.add(signBoard);

            // Cartel cuadrado con flecha diagonal blanca
            const arrowBoard = new THREE.Mesh(
              new THREE.BoxGeometry(1.5, 1.5, 0.25),
              new THREE.MeshStandardMaterial({ map: this.tex.arrow, roughness: 0.6 })
            );
            arrowBoard.position.set(3.6, 6.9, 0.22);
            segGroup.add(arrowBoard);
          }

          // Semáforo ferroviario ocasional
          if (idx % 4 === 3) {
            const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.12, 3.8, 8), new THREE.MeshStandardMaterial({ color: 0x1e293b }));
            pole.position.set(-5.2, 1.9, 0);
            const box = new THREE.Mesh(new THREE.BoxGeometry(0.45, 1.1, 0.4), new THREE.MeshStandardMaterial({ color: 0x0f172a }));
            box.position.set(-5.2, 3.5, 0);
            const redLight = new THREE.Mesh(new THREE.SphereGeometry(0.13, 10, 10), new THREE.MeshBasicMaterial({ color: 0xef4444 }));
            redLight.position.set(-5.2, 3.75, 0.2);
            const greenLight = new THREE.Mesh(new THREE.SphereGeometry(0.13, 10, 10), new THREE.MeshBasicMaterial({ color: 0x22c55e }));
            greenLight.position.set(-5.2, 3.25, 0.2);
            segGroup.add(pole, box, redLight, greenLight);
          }
        }

        this.scene.add(segGroup);
        this.worldSegments.push(segGroup);
      }

      /**
       * Crea un tren 3D detallado (estacionado, con rampa de subida o en movimiento)
       */
      createTrain(laneIdx, zPos, length = 16, isRed = false, movingSpeed = 0, hasRamp = false) {
        const trainGroup = new THREE.Group();
        const x = this.LANES[laneIdx];
        trainGroup.position.set(x, 0, zPos);

        const frontTex = isRed ? this.tex.trainFrontRed : this.tex.trainFrontSilver;
        const sideTex = isRed ? this.tex.trainSideRed : this.tex.trainSideSilver;

        const roofMat = new THREE.MeshStandardMaterial({
          color: isRed ? 0xfb923c : 0xe2e8f0,
          roughness: 0.45,
          metalness: 0.2
        });
        const sideMat = new THREE.MeshStandardMaterial({ map: sideTex, roughness: 0.5 });
        const frontMat = new THREE.MeshStandardMaterial({ map: frontTex, roughness: 0.45 });

        const materials = [
          sideMat,  // right
          sideMat,  // left
          roofMat,  // top
          roofMat,  // bottom
          frontMat, // front (+Z mirando hacia el jugador)
          frontMat  // back
        ];

        const body = new THREE.Mesh(new THREE.BoxGeometry(2.55, this.TRAIN_HEIGHT, length), materials);
        body.position.y = this.TRAIN_HEIGHT / 2;
        body.castShadow = true;
        body.receiveShadow = true;
        trainGroup.add(body);

        // Detalle de nervaduras en el techo del tren
        const ribMat = new THREE.MeshStandardMaterial({ color: 0x94a3b8, roughness: 0.6 });
        [-0.75, 0, 0.75].forEach(rx => {
          const rib = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.08, length - 0.6), ribMat);
          rib.position.set(rx, this.TRAIN_HEIGHT + 0.03, 0);
          trainGroup.add(rib);
        });

        // Rampa frontal amarilla/negra para subir corriendo al techo del tren
        if (hasRamp) {
          const rampGeo = new THREE.BoxGeometry(2.45, 0.25, 4.4);
          const rampMat = new THREE.MeshStandardMaterial({ color: 0xfacc15, roughness: 0.5 });
          const ramp = new THREE.Mesh(rampGeo, rampMat);
          ramp.position.set(0, this.TRAIN_HEIGHT / 2 - 0.05, length / 2 + 1.8);
          ramp.rotation.x = Math.atan2(this.TRAIN_HEIGHT, 3.8);
          trainGroup.add(ramp);
        }

        this.scene.add(trainGroup);
        this.obstacles.push({
          type: 'TRAIN',
          mesh: trainGroup,
          lane: laneIdx,
          z: zPos,
          length: length,
          height: this.TRAIN_HEIGHT,
          speed: movingSpeed,
          hasRamp: hasRamp
        });
      }

      /**
       * Crea una valla baja roja/blanca con X (saltable) o una barrera alta (deslizable)
       */
      createBarrier(laneIdx, zPos, isHigh = false) {
        const group = new THREE.Group();
        group.position.set(this.LANES[laneIdx], 0, zPos);

        const postMat = new THREE.MeshStandardMaterial({ color: 0x334155, metalness: 0.6 });

        if (!isHigh) {
          // Valla baja con gran aspa blanca X (fiel a image_6aaf25.png)
          const board = new THREE.Mesh(new THREE.BoxGeometry(2.5, 1.35, 0.28), this.mats.barrierX);
          board.position.y = 0.78;
          board.castShadow = true;
          group.add(board);

          // Luces circulares superiores
          const lampMat = new THREE.MeshStandardMaterial({ color: 0x94a3b8 });
          [-0.95, 0.95].forEach(lx => {
            const lamp = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.18, 0.34, 12), lampMat);
            lamp.rotation.x = Math.PI / 2;
            lamp.position.set(lx, 1.56, 0);
            group.add(lamp);
          });

          this.scene.add(group);
          this.obstacles.push({
            type: 'LOW_BARRIER',
            mesh: group,
            lane: laneIdx,
            z: zPos,
            length: 0.6,
            minY: 0,
            maxY: 1.45
          });
        } else {
          // Barrera alta con paso inferior para deslizarse (como en video_1.mp4 00:06)
          [-1.2, 1.2].forEach(px => {
            const post = new THREE.Mesh(new THREE.BoxGeometry(0.18, 2.7, 0.22), postMat);
            post.position.set(px, 1.35, 0);
            group.add(post);
          });
          const topBoard = new THREE.Mesh(new THREE.BoxGeometry(2.6, 0.95, 0.25), this.mats.highBarrier);
          topBoard.position.y = 2.15;
          topBoard.castShadow = true;
          group.add(topBoard);

          this.scene.add(group);
          this.obstacles.push({
            type: 'HIGH_BARRIER',
            mesh: group,
            lane: laneIdx,
            z: zPos,
            length: 0.6,
            minY: 1.48,
            maxY: 2.7
          });
        }
      }

      /**
       * Crea una moneda dorada con estrella o una ficha azul de Power-Up Rayo
       */
      createCollectible(laneIdx, yPos, zPos, kind = 'COIN') {
        const group = new THREE.Group();
        group.position.set(this.LANES[laneIdx], yPos, zPos);

        if (kind === 'COIN') {
          const geo = new THREE.CylinderGeometry(0.48, 0.48, 0.16, 20);
          geo.rotateX(Math.PI / 2);
          const mesh = new THREE.Mesh(geo, [this.mats.coinRim, this.mats.coin, this.mats.coin]);
          mesh.castShadow = true;
          group.add(mesh);
        } else {
          // Ficha ovalada azul eléctrico con rayo (fiel a image_6aaf25.png y video_1.mp4)
          const geo = new THREE.CylinderGeometry(0.68, 0.68, 0.22, 24);
          geo.rotateX(Math.PI / 2);
          geo.scale(0.82, 1.15, 1);
          const tokenMesh = new THREE.Mesh(geo, this.mats.lightning);
          group.add(tokenMesh);

          const ringGeo = new THREE.TorusGeometry(0.86, 0.045, 8, 24);
          ringGeo.scale(0.85, 1.15, 1);
          const ringMat = new THREE.MeshBasicMaterial({ color: 0x7dd3fc });
          const ring = new THREE.Mesh(ringGeo, ringMat);
          group.add(ring);
        }

        this.scene.add(group);
        this.collectibles.push({
          kind: kind,
          mesh: group,
          lane: laneIdx,
          baseY: yPos,
          z: zPos,
          collected: false
        });
      }

      /**
       * Genera oleadas variadas de trenes, vallas, monedas y potenciadores
       */
      spawnPattern() {
        const z = this.nextSpawnZ;
        const patternType = Math.floor(Math.random() * 5);

        if (patternType === 0) {
          // Tren con rampa en un carril + monedas encima del techo + vallas en otros
          const trainLane = Math.floor(Math.random() * 3);
          this.createTrain(trainLane, z - 8, 16, Math.random() > 0.5, 0, true);
          for (let i = 0; i < 6; i++) {
            this.createCollectible(trainLane, this.TRAIN_HEIGHT + 0.85, z - 2 - i * 2.4, 'COIN');
          }
          const otherLane = (trainLane + 1) % 3;
          this.createBarrier(otherLane, z - 4, false);
          this.nextSpawnZ -= 26;
        } else if (patternType === 1) {
          // Dos trenes paralelos dejando un carril libre con valla alta deslizable
          const openLane = Math.floor(Math.random() * 3);
          for (let l = 0; l < 3; l++) {
            if (l === openLane) {
              this.createBarrier(l, z - 6, true);
              for (let i = 0; i < 5; i++) {
                this.createCollectible(l, 0.75, z - 1 - i * 2.5, 'COIN');
              }
            } else {
              const moving = Math.random() > 0.65 ? 9 : 0;
              this.createTrain(l, z - 8, 15, l === 0, moving, false);
            }
          }
          this.nextSpawnZ -= 26;
        } else if (patternType === 2) {
          // Arco de salto sobre valla baja con fila de monedas
          const lane = Math.floor(Math.random() * 3);
          this.createBarrier(lane, z - 6, false);
          const arcHeights = [0.85, 1.85, 2.45, 1.85, 0.85];
          arcHeights.forEach((h, idx) => {
            this.createCollectible(lane, h, z - 1 - idx * 2.5, 'COIN');
          });
          // Power-up de rayo en otro carril
          if (Math.random() > 0.45) {
            const pLane = (lane + 2) % 3;
            this.createCollectible(pLane, 1.15, z - 7, 'POWERUP');
          }
          this.nextSpawnZ -= 22;
        } else if (patternType === 3) {
          // Trenes escalonados para saltar de techo en techo (como en video_1.mp4)
          const l1 = 1;
          const l2 = Math.random() > 0.5 ? 0 : 2;
          this.createTrain(l1, z - 6, 13, false, 0, true);
          this.createTrain(l2, z - 21, 14, true, 0, false);
          for (let i = 0; i < 4; i++) {
            this.createCollectible(l1, this.TRAIN_HEIGHT + 0.85, z - 1 - i * 2.5, 'COIN');
            this.createCollectible(l2, this.TRAIN_HEIGHT + 0.85, z - 16 - i * 2.5, 'COIN');
          }
          this.nextSpawnZ -= 36;
        } else {
          // Vallas alternas izquierda/centro/derecha + ficha de rayo azul
          const lA = 0;
          const lB = 2;
          this.createBarrier(lA, z - 4, false);
          this.createBarrier(lB, z - 11, true);
          for (let i = 0; i < 5; i++) {
            this.createCollectible(1, 0.85, z - 2 - i * 2.4, 'COIN');
          }
          if (Math.random() > 0.4) {
            this.createCollectible(1, 1.15, z - 14.5, 'POWERUP');
          }
          this.nextSpawnZ -= 24;
        }
      }

      /**
       * Genera partículas (chispas doradas al deslizarse o destellos eléctricos)
       */
      spawnParticle(x, y, z, colorHex) {
        const geo = new THREE.BoxGeometry(0.14, 0.14, 0.14);
        const mat = new THREE.MeshBasicMaterial({ color: colorHex });
        const mesh = new THREE.Mesh(geo, mat);
        mesh.position.set(x + (Math.random() - 0.5) * 0.5, y, z + 0.3);
        this.scene.add(mesh);
        this.particles.push({
          mesh,
          vx: (Math.random() - 0.5) * 3.5,
          vy: 1.5 + Math.random() * 3.0,
          vz: 3 + Math.random() * 4,
          life: 0.35
        });
      }

      // -----------------------------------------------------------------------
      // ACCIONES DEL JUGADOR
      // -----------------------------------------------------------------------
      moveLeft() {
        if (this.state !== 'PLAYING') return;
        if (this.currentLane > 0) {
          this.currentLane--;
          this.sound.playLane();
        }
      }

      moveRight() {
        if (this.state !== 'PLAYING') return;
        if (this.currentLane < 2) {
          this.currentLane++;
          this.sound.playLane();
        }
      }

      jump() {
        if (this.state !== 'PLAYING') return;
        if (!this.isJumping) {
          this.isJumping = true;
          this.isSliding = false;
          this.slideTimer = 0;
          this.velocityY = this.JUMP_FORCE;
          this.sound.playJump();
        }
      }

      slide() {
        if (this.state !== 'PLAYING') return;
        if (this.isJumping) {
          // Caída rápida en el aire (fast-fall)
          this.velocityY = -36;
        }
        this.isSliding = true;
        this.slideTimer = 0.65;
        this.sound.playSlide();
      }

      activatePowerUp() {
        this.powerUpTimer = this.POWERUP_DURATION;
        this.sound.playPowerUp();
        this.cameraShake = 0.25;

        const burst = document.getElementById('comic-burst');
        burst.classList.remove('active');
        void burst.offsetWidth;
        burst.classList.add('active');
      }

      // -----------------------------------------------------------------------
      // FLUJO DE ESTADOS DEL JUEGO
      // -----------------------------------------------------------------------
      startGame() {
        this.sound.init();
        this.state = 'PLAYING';
        this.score = 0;
        this.coins = 0;
        this.multiplier = 1;
        this.distance = 0;
        this.baseSpeed = 24;
        this.currentSpeed = 24;
        this.powerUpTimer = 0;
        this.invulnerableTimer = 0;

        this.currentLane = 1;
        this.playerX = 0;
        this.playerY = 0;
        this.groundY = 0;
        this.velocityY = 0;
        this.isJumping = false;
        this.isSliding = false;
        this.slideTimer = 0;

        // Limpiar obstáculos y coleccionables anteriores
        this.obstacles.forEach(o => this.scene.remove(o.mesh));
        this.collectibles.forEach(c => this.scene.remove(c.mesh));
        this.obstacles = [];
        this.collectibles = [];

        this.nextSpawnZ = -32;
        for (let i = 0; i < 6; i++) {
          this.spawnPattern();
        }

        document.getElementById('screen-start').classList.add('hidden');
        document.getElementById('screen-pause').classList.add('hidden');
        document.getElementById('screen-gameover').classList.add('hidden');
        document.getElementById('hud').classList.remove('hidden');
        this.updateHUD();
      }

      pauseGame() {
        if (this.state !== 'PLAYING') return;
        this.state = 'PAUSED';
        document.getElementById('screen-pause').classList.remove('hidden');
      }

      resumeGame() {
        if (this.state !== 'PAUSED') return;
        this.state = 'PLAYING';
        this.lastTime = performance.now();
        document.getElementById('screen-pause').classList.add('hidden');
      }

      gameOver() {
        this.state = 'GAMEOVER';
        this.sound.playCrash();
        this.cameraShake = 0.45;

        const flash = document.getElementById('damage-flash');
        flash.style.opacity = '1';
        setTimeout(() => { flash.style.opacity = '0'; }, 280);

        const finalScore = Math.floor(this.score);
        let isNewRecord = false;
        if (finalScore > this.highScore) {
          this.highScore = finalScore;
          localStorage.setItem('ss_highScore', String(this.highScore));
          isNewRecord = true;
        }
        this.totalCoins += this.coins;
        localStorage.setItem('ss_totalCoins', String(this.totalCoins));

        document.getElementById('hud').classList.add('hidden');
        document.getElementById('screen-gameover').classList.remove('hidden');
        document.getElementById('go-score').textContent = String(finalScore).padStart(6, '0');
        document.getElementById('go-highscore').textContent = String(this.highScore).padStart(6, '0');
        document.getElementById('go-coins').textContent = `+${this.coins}`;

        const badge = document.getElementById('new-record-badge');
        if (isNewRecord && finalScore > 0) badge.classList.remove('hidden');
        else badge.classList.add('hidden');
      }

      updateHUD() {
        document.getElementById('hud-score').textContent = String(Math.floor(this.score)).padStart(6, '0');
        document.getElementById('hud-multiplier').textContent = `x${this.multiplier}`;
        document.getElementById('hud-coins').textContent = String(this.coins);

        const pWrap = document.getElementById('powerup-bar-wrap');
        const pFill = document.getElementById('powerup-bar-fill');
        if (this.powerUpTimer > 0) {
          pWrap.classList.remove('hidden');
          const pct = Math.max(0, Math.min(100, (this.powerUpTimer / this.POWERUP_DURATION) * 100));
          pFill.style.width = `${pct}%`;
        } else {
          pWrap.classList.add('hidden');
        }
      }

      updateStartUI() {
        document.getElementById('start-highscore').textContent = String(this.highScore).padStart(6, '0');
        document.getElementById('start-totalcoins').textContent = String(this.totalCoins);
      }

      // -----------------------------------------------------------------------
      // BUCLE DE SIMULACIÓN Y FÍSICA
      // -----------------------------------------------------------------------
      update(dt) {
        // Animación suave en pantalla de inicio
        if (this.state === 'START') {
          this.runCycle += dt * 7;
          this.animateCharacter(dt, false);
          this.camera.position.x = Math.sin(performance.now() * 0.0008) * 1.4;
          this.camera.position.y = 4.8 + Math.cos(performance.now() * 0.001) * 0.25;
          this.camera.lookAt(0, 1.8, -12);
          return;
        }

        if (this.state !== 'PLAYING') return;

        // Progresión de velocidad y multiplicador
        this.distance += this.currentSpeed * dt;
        this.baseSpeed = Math.min(44, 24 + this.distance * 0.008);
        const turboBoost = this.powerUpTimer > 0 ? 11 : 0;
        this.currentSpeed = this.baseSpeed + turboBoost;

        this.multiplier = Math.min(5, 1 + Math.floor(this.distance / 350));
        this.score += this.currentSpeed * dt * 1.6 * this.multiplier;

        if (this.powerUpTimer > 0) {
          this.powerUpTimer = Math.max(0, this.powerUpTimer - dt);
        }
        if (this.invulnerableTimer > 0) {
          this.invulnerableTimer = Math.max(0, this.invulnerableTimer - dt);
        }

        // Desplazar textura de vías para sensación continua de velocidad
        this.tex.track.offset.y -= (this.currentSpeed * dt) / 40;

        // Reciclar segmentos del entorno infinito
        for (let i = this.worldSegments.length - 1; i >= 0; i--) {
          const seg = this.worldSegments[i];
          seg.position.z += this.currentSpeed * dt;
          if (seg.position.z > 30) {
            this.scene.remove(seg);
            this.worldSegments.splice(i, 1);
            const minZ = Math.min(...this.worldSegments.map(s => s.position.z));
            this.spawnWorldSegment(minZ - 30);
          }
        }

        // Interpolación lateral del jugador entre los 3 carriles
        const targetX = this.LANES[this.currentLane];
        const prevX = this.playerX;
        this.playerX += (targetX - this.playerX) * Math.min(1, dt * 16);
        const tiltZ = (prevX - this.playerX) * 2.2;

        // Actualizar obstáculos y calcular altura de suelo (vía o techo de tren)
        let supportY = 0;

        for (let i = this.obstacles.length - 1; i >= 0; i--) {
          const obs = this.obstacles[i];
          const relSpeed = this.currentSpeed + (obs.speed || 0);
          obs.z += relSpeed * dt;
          obs.mesh.position.z = obs.z;

          if (obs.z - obs.length / 2 > 16) {
            this.scene.remove(obs.mesh);
            this.obstacles.splice(i, 1);
            continue;
          }

          const sameLane = Math.abs(this.playerX - this.LANES[obs.lane]) < 1.15;
          if (!sameLane) continue;

          if (obs.type === 'TRAIN') {
            const frontZ = obs.z + obs.length / 2;
            const backZ = obs.z - obs.length / 2;

            // Subida por rampa frontal del tren
            if (obs.hasRamp && frontZ >= -0.6 && frontZ <= 4.4) {
              const rampProgress = Math.max(0, Math.min(1, (4.4 - frontZ) / 4.4));
              supportY = Math.max(supportY, rampProgress * obs.height);
            }

            // Sobre el segmento del tren
            if (frontZ >= -0.55 && backZ <= 0.55) {
              if (this.playerY >= obs.height - 0.45) {
                supportY = Math.max(supportY, obs.height);
              } else {
                // Impacto contra el tren
                if (this.powerUpTimer > 0) {
                  // Escudo de rayo destruye/supera el obstáculo y consume el turbo
                  this.powerUpTimer = 0;
                  this.invulnerableTimer = 1.0;
                  this.cameraShake = 0.35;
                  this.sound.playCrash();
                  this.scene.remove(obs.mesh);
                  this.obstacles.splice(i, 1);
                } else if (this.invulnerableTimer <= 0) {
                  this.gameOver();
                  return;
                }
              }
            }
          } else if (obs.type === 'LOW_BARRIER') {
            if (Math.abs(obs.z) < 0.65 && this.playerY < obs.maxY - 0.15) {
              if (this.powerUpTimer > 0) {
                this.powerUpTimer = 0;
                this.invulnerableTimer = 1.0;
                this.cameraShake = 0.3;
                this.scene.remove(obs.mesh);
                this.obstacles.splice(i, 1);
              } else if (this.invulnerableTimer <= 0) {
                this.gameOver();
                return;
              }
            }
          } else if (obs.type === 'HIGH_BARRIER') {
            const playerTop = this.playerY + (this.isSliding ? 0.9 : 2.05);
            if (Math.abs(obs.z) < 0.65 && playerTop > obs.minY && this.playerY < obs.maxY) {
              if (this.powerUpTimer > 0) {
                this.powerUpTimer = 0;
                this.invulnerableTimer = 1.0;
                this.cameraShake = 0.3;
                this.scene.remove(obs.mesh);
                this.obstacles.splice(i, 1);
              } else if (this.invulnerableTimer <= 0) {
                this.gameOver();
                return;
              }
            }
          }
        }

        // Física vertical del jugador (gravedad y aterrizaje sobre trenes o suelo)
        this.groundY = supportY;
        if (this.playerY > this.groundY || this.velocityY > 0) {
          this.velocityY += this.GRAVITY * dt;
          this.playerY += this.velocityY * dt;
          if (this.playerY <= this.groundY) {
            this.playerY = this.groundY;
            this.velocityY = 0;
            this.isJumping = false;
          } else {
            this.isJumping = true;
          }
        } else {
          this.playerY = this.groundY;
          this.isJumping = false;
        }

        // Temporizador de deslizamiento y chispas doradas (como en video_1.mp4 00:06)
        if (this.isSliding) {
          this.slideTimer -= dt;
          if (Math.random() > 0.25) {
            this.spawnParticle(this.playerX, this.playerY + 0.12, 0.2, 0xfacc15);
          }
          if (this.slideTimer <= 0) {
            this.isSliding = false;
          }
        }

        // Actualizar posición y animación del personaje
        this.playerGroup.position.set(this.playerX, this.playerY, 0);
        this.playerBody.rotation.z = tiltZ;
        this.groundShadow.position.set(this.playerX, this.groundY + 0.03, 0);
        const shadowScale = Math.max(0.45, 1 - (this.playerY - this.groundY) * 0.14);
        this.groundShadow.scale.set(shadowScale, shadowScale, 1);

        this.runCycle += dt * (this.currentSpeed * 0.58);
        this.animateCharacter(dt, true);

        // Actualizar coleccionables (Monedas y Power-Ups de Rayo)
        for (let i = this.collectibles.length - 1; i >= 0; i--) {
          const item = this.collectibles[i];
          item.z += this.currentSpeed * dt;
          item.mesh.rotation.y += dt * 3.6;
          item.mesh.position.y = item.baseY + Math.sin(performance.now() * 0.006 + i) * 0.12;

          // Imán automático hacia el jugador cuando el Power-Up de rayo está activo
          if (this.powerUpTimer > 0 && item.kind === 'COIN' && item.z > -16 && item.z < 2) {
            item.mesh.position.x += (this.playerX - item.mesh.position.x) * Math.min(1, dt * 12);
            item.mesh.position.y += (this.playerY + 1.0 - item.mesh.position.y) * Math.min(1, dt * 12);
          }
          item.mesh.position.z = item.z;

          if (item.z > 10) {
            this.scene.remove(item.mesh);
            this.collectibles.splice(i, 1);
            continue;
          }

          // Detección de recogida
          const dx = Math.abs(this.playerX - item.mesh.position.x);
          const dy = Math.abs((this.playerY + 1.0) - item.mesh.position.y);
          const dz = Math.abs(item.z);

          if (dx < 1.1 && dy < 1.35 && dz < 1.15) {
            if (item.kind === 'COIN') {
              this.coins++;
              this.score += 25 * this.multiplier;
              this.sound.playCoin();
              this.spawnParticle(item.mesh.position.x, item.mesh.position.y, 0, 0xfef08a);
            } else if (item.kind === 'POWERUP') {
              this.activatePowerUp();
              this.score += 100 * this.multiplier;
            }
            this.scene.remove(item.mesh);
            this.collectibles.splice(i, 1);
          }
        }

        // Actualizar partículas
        for (let i = this.particles.length - 1; i >= 0; i--) {
          const p = this.particles[i];
          p.life -= dt;
          p.mesh.position.x += p.vx * dt;
          p.mesh.position.y += p.vy * dt;
          p.mesh.position.z += p.vz * dt;
          p.mesh.scale.setScalar(Math.max(0.01, p.life * 2.5));
          if (p.life <= 0) {
            this.scene.remove(p.mesh);
            this.particles.splice(i, 1);
          }
        }

        // Generar nuevos patrones continuamente
        this.nextSpawnZ += this.currentSpeed * dt;
        while (this.nextSpawnZ > -140) {
          this.spawnPattern();
        }

        // Seguimiento dinámico de cámara trasera (se eleva al subir a trenes)
        const targetCamX = this.playerX * 0.62;
        const targetCamY = 5.2 + this.playerY * 0.78 + Math.abs(Math.sin(this.runCycle)) * 0.08;
        const targetCamZ = this.powerUpTimer > 0 ? 8.8 : 8.0;

        this.camera.position.x += (targetCamX - this.camera.position.x) * Math.min(1, dt * 8);
        this.camera.position.y += (targetCamY - this.camera.position.y) * Math.min(1, dt * 7);
        this.camera.position.z += (targetCamZ - this.camera.position.z) * Math.min(1, dt * 6);

        if (this.cameraShake > 0) {
          this.camera.position.x += (Math.random() - 0.5) * this.cameraShake;
          this.camera.position.y += (Math.random() - 0.5) * this.cameraShake;
          this.cameraShake = Math.max(0, this.cameraShake - dt * 1.5);
        }

        this.camera.lookAt(this.playerX * 0.35, 1.9 + this.playerY * 0.65, -11);
        this.updateHUD();
      }

      animateCharacter(dt, isRunning) {
        // Aura eléctrica azul cuando el Power-Up está activo
        if (this.powerUpTimer > 0) {
          this.electricAura.visible = true;
          this.electricAura.rotation.y += dt * 8;
          this.electricAura.rotation.z += dt * 5;
          if (Math.random() > 0.4) {
            this.spawnParticle(this.playerX, this.playerY + 1.1, 0, 0x38bdf8);
          }
        } else {
          this.electricAura.visible = false;
        }

        if (this.isSliding) {
          // Pose inclinada de surf/deslizamiento
          this.playerBody.scale.set(1.05, 0.56, 1.05);
          this.playerBody.rotation.x = -0.55;
          this.leftArm.rotation.x = -0.8;
          this.rightArm.rotation.x = 0.8;
          this.leftLeg.rotation.x = 0.7;
          this.rightLeg.rotation.x = -0.4;
        } else if (this.isJumping) {
          // Pose acrobática en el aire
          this.playerBody.scale.set(1, 1, 1);
          this.playerBody.rotation.x = 0.18;
          this.leftArm.rotation.x = -2.1;
          this.rightArm.rotation.x = -1.7;
          this.leftLeg.rotation.x = 0.65;
          this.rightLeg.rotation.x = -0.55;
        } else {
          // Zancada y braceo continuo al correr
          this.playerBody.scale.set(1, 1, 1);
          this.playerBody.rotation.x = isRunning ? 0.14 : 0.02;
          const swing = Math.sin(this.runCycle);
          this.leftLeg.rotation.x = swing * 0.95;
          this.rightLeg.rotation.x = -swing * 0.95;
          this.leftArm.rotation.x = -swing * 0.85;
          this.rightArm.rotation.x = swing * 0.85;
        }
      }

      animate(now) {
        requestAnimationFrame(this.animate);
        const dt = Math.min(0.05, (now - this.lastTime) / 1000);
        this.lastTime = now;

        this.update(dt);
        this.renderer.render(this.scene, this.camera);
      }

      // -----------------------------------------------------------------------
      // CONTROLES DE TECLADO, TÁCTIL Y BOTONES UI
      // -----------------------------------------------------------------------
      bindEvents() {
        window.addEventListener('resize', () => {
          const w = this.container.clientWidth || window.innerWidth;
          const h = this.container.clientHeight || window.innerHeight;
          this.camera.aspect = w / h;
          this.camera.updateProjectionMatrix();
          this.renderer.setSize(w, h);
        });

        window.addEventListener('keydown', (e) => {
          if (e.code === 'ArrowLeft' || e.code === 'KeyA') this.moveLeft();
          else if (e.code === 'ArrowRight' || e.code === 'KeyD') this.moveRight();
          else if (e.code === 'ArrowUp' || e.code === 'KeyW' || e.code === 'Space') {
            if (this.state === 'START') this.startGame();
            else this.jump();
          } else if (e.code === 'ArrowDown' || e.code === 'KeyS') this.slide();
          else if (e.code === 'Escape' || e.code === 'KeyP') {
            if (this.state === 'PLAYING') this.pauseGame();
            else if (this.state === 'PAUSED') this.resumeGame();
          }
        });

        // Gestos táctiles y arrastre con ratón (Swipe)
        let startX = 0;
        let startY = 0;
        let tracking = false;

        const onStart = (x, y) => {
          startX = x;
          startY = y;
          tracking = true;
        };

        const onEnd = (x, y) => {
          if (!tracking) return;
          tracking = false;
          const dx = x - startX;
          const dy = y - startY;
          if (Math.abs(dx) < 24 && Math.abs(dy) < 24) return;

          if (Math.abs(dx) > Math.abs(dy)) {
            if (dx > 0) this.moveRight();
            else this.moveLeft();
          } else {
            if (dy < 0) this.jump();
            else this.slide();
          }
        };

        this.renderer.domElement.addEventListener('touchstart', (e) => {
          if (e.touches.length > 0) onStart(e.touches[0].clientX, e.touches[0].clientY);
        }, { passive: true });

        this.renderer.domElement.addEventListener('touchend', (e) => {
          if (e.changedTouches.length > 0) onEnd(e.changedTouches[0].clientX, e.changedTouches[0].clientY);
        }, { passive: true });

        this.renderer.domElement.addEventListener('mousedown', (e) => onStart(e.clientX, e.clientY));
        window.addEventListener('mouseup', (e) => onEnd(e.clientX, e.clientY));

        // Botones de interfaz
        document.getElementById('btn-play').addEventListener('click', () => this.startGame());
        document.getElementById('btn-pause').addEventListener('click', () => this.pauseGame());
        document.getElementById('btn-resume').addEventListener('click', () => this.resumeGame());
        document.getElementById('btn-restart-pause').addEventListener('click', () => this.startGame());
        document.getElementById('btn-restart').addEventListener('click', () => this.startGame());

        const syncSoundButtons = () => {
          const on = this.sound.enabled;
          document.getElementById('icon-sound-on').classList.toggle('hidden', !on);
          document.getElementById('icon-sound-off').classList.toggle('hidden', on);
          document.getElementById('btn-sound-pause').textContent = on ? 'SONIDO: ACTIVADO' : 'SONIDO: SILENCIADO';
        };

        document.getElementById('btn-sound-start').addEventListener('click', () => {
          this.sound.toggle();
          syncSoundButtons();
        });
        document.getElementById('btn-sound-pause').addEventListener('click', () => {
          this.sound.toggle();
          syncSoundButtons();
        });
      }
    }

    window.addEventListener('load', () => {
      new SubwaySurfersGame();
    });
  </script>
</body>
