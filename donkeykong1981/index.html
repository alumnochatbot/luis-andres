<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Donkey Kong Arcade Retro</title>
  <!-- Tailwind CSS CDN para la interfaz circundante -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Fuente Retro Arcade tipo 8-bit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }
    body {
      background: radial-gradient(circle at 50% 30%, #1e1035 0%, #0a0412 100%);
      font-family: 'Press Start 2P', monospace, sans-serif;
      overflow-x: hidden;
      margin: 0;
      color: #fff;
    }
    /* Estilos del gabinete Arcade */
    .arcade-frame {
      box-shadow: 0 0 50px rgba(255, 30, 80, 0.25), inset 0 0 20px rgba(0, 0, 0, 0.9);
      border: 4px solid #33154a;
    }
    /* Canvas Scanlines y brillo retro */
    .screen-container {
      position: relative;
      background: #000;
      box-shadow: inset 0 0 40px rgba(0, 0, 0, 0.9);
    }
    .screen-container::after {
      content: " ";
      display: block;
      position: absolute;
      top: 0; left: 0; bottom: 0; right: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.35) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
      z-index: 20;
      background-size: 100% 3px, 6px 100%;
      pointer-events: none;
    }
    /* Botones virtuales */
    .touch-btn {
      background: radial-gradient(circle at 35% 35%, #ff4b4b 0%, #990000 100%);
      box-shadow: 0 5px 0 #550000, 0 8px 10px rgba(0,0,0,0.5);
      active: translateY(4px);
    }
    .touch-btn:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 #550000, 0 4px 6px rgba(0,0,0,0.6);
    }
    .dpad-btn {
      background: radial-gradient(circle at 30% 30%, #444 0%, #1a1a1a 100%);
      border: 1px solid #555;
      box-shadow: 0 4px 0 #111;
    }
    .dpad-btn:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 #111;
      background: #333;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between p-2 sm:p-4 text-white">

  <!-- Header: Marcadores Arcade Clásicos -->
  <header class="w-full max-w-2xl flex flex-col sm:flex-row justify-between items-center px-4 py-2 text-xs sm:text-sm tracking-wider gap-2">
    <div class="flex items-center space-x-2 text-red-500 font-bold">
      <span>1UP</span>
      <span id="scoreDisplay" class="text-white">000000</span>
    </div>
    <div class="flex items-center space-x-2 text-yellow-400 font-bold">
      <span>HIGH</span>
      <span id="highScoreDisplay" class="text-white">010000</span>
    </div>
    <div class="flex items-center space-x-2 text-cyan-400 font-bold">
      <span>BONUS</span>
      <span id="bonusDisplay" class="text-white">5000</span>
    </div>
    <div class="flex items-center space-x-1 text-red-400">
      <span>L:</span>
      <span id="livesContainer" class="flex text-yellow-300">❤️❤️❤️</span>
    </div>
  </header>

  <!-- Gabinete y Pantalla de Juego -->
  <main class="w-full max-w-2xl flex flex-col items-center">
    <div class="arcade-frame rounded-2xl p-2 sm:p-4 bg-gradient-to-b from-neutral-900 to-black w-full flex flex-col items-center">
      
      <!-- Contenedor del Canvas -->
      <div class="screen-container rounded-lg overflow-hidden border-2 border-neutral-800 w-full relative flex justify-center items-center">
        <canvas id="gameCanvas" width="560" height="640" class="w-full h-auto max-h-[70vh] aspect-[7/8] block bg-black"></canvas>

        <!-- Overlay de Inicio / Pausa / Fin de Partida -->
        <div id="modalOverlay" class="absolute inset-0 z-30 bg-black/85 flex flex-col items-center justify-center p-6 text-center">
          <h1 id="modalTitle" class="text-2xl sm:text-4xl text-red-600 mb-4 tracking-widest leading-relaxed drop-shadow-[0_4px_10px_rgba(255,0,0,0.8)]">
            DONKEY KONG
          </h1>
          <p id="modalSubtitle" class="text-xs sm:text-sm text-yellow-300 mb-6 leading-6">
            ¡Rescata a Pauline!<br>Sube por las vigas y esquiva los barriles.
          </p>
          <div class="text-[10px] sm:text-xs text-neutral-300 mb-6 space-y-2">
            <p>🕹️ <strong>Controles de Teclado:</strong></p>
            <p>Flechas / A-D: <span class="text-cyan-400">Moverse</span></p>
            <p>Flechas Arriba/Abajo / W-S: <span class="text-cyan-400">Escalar</span></p>
            <p>Espacio: <span class="text-cyan-400">Saltar (+100 pts)</span></p>
          </div>
          <button id="startBtn" class="px-6 py-3 bg-red-600 hover:bg-red-500 text-white font-bold rounded-lg text-sm sm:text-base border-2 border-red-400 shadow-[0_0_15px_rgba(255,50,50,0.8)] transition transform active:scale-95 cursor-pointer">
            INSERTAR MONEDA / JUGAR
          </button>
        </div>

      </div>

      <!-- Barra de Estado Inferior en Gabinete -->
      <div class="w-full flex justify-between items-center text-[10px] text-neutral-400 mt-2 px-2">
        <span class="flex items-center gap-1">
          NIVEL: <span id="levelDisplay" class="text-green-400 font-bold">1</span>
        </span>
        <button id="soundToggle" class="text-xs text-cyan-400 hover:text-cyan-200 transition">
          🔊 SONIDO: <span id="soundStatusText">ON</span>
        </button>
      </div>
    </div>
  </main>

  <!-- Controles Táctiles para Móviles / Tablets -->
  <footer class="w-full max-w-md my-2 block select-none">
    <div class="grid grid-cols-2 gap-4 items-center justify-between px-4">
      
      <!-- D-PAD Cruzeta Virtual -->
      <div class="flex flex-col items-center">
        <button id="btnUp" class="dpad-btn w-12 h-12 rounded-t-lg flex items-center justify-center text-lg font-bold">▲</button>
        <div class="flex">
          <button id="btnLeft" class="dpad-btn w-12 h-12 rounded-l-lg flex items-center justify-center text-lg font-bold">◀</button>
          <div class="w-12 h-12 bg-neutral-900 border border-neutral-800 flex items-center justify-center text-[8px] text-neutral-500">🕹️</div>
          <button id="btnRight" class="dpad-btn w-12 h-12 rounded-r-lg flex items-center justify-center text-lg font-bold">▶</button>
        </div>
        <button id="btnDown" class="dpad-btn w-12 h-12 rounded-b-lg flex items-center justify-center text-lg font-bold">▼</button>
      </div>

      <!-- Botón de Salto Virtual -->
      <div class="flex flex-col items-center justify-center">
        <button id="btnJump" class="touch-btn w-20 h-20 rounded-full flex flex-col items-center justify-center border-2 border-red-300 font-bold text-sm tracking-wide text-white">
          <span>SALTAR</span>
          <span class="text-[9px] opacity-80">(JUMP)</span>
        </button>
      </div>

    </div>
  </footer>

  <!-- SCRIPT DEL JUEGO -->
  <script>
    /* ========================================================================
       SISTEMA DE AUDIO VINTAGE (Web Audio API Synthesizer)
       ======================================================================== */
    class RetroAudio {
      constructor() {
        this.ctx = null;
        this.muted = false;
      }
      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) {
            this.ctx = new AudioContext();
          }
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }
      playJump() {
        if (this.muted || !this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(150, now);
        osc.frequency.exponentialRampToValueAtTime(600, now + 0.15);
        gain.gain.setValueAtTime(0.12, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.15);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.15);
      }
      playStep() {
        if (this.muted || !this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(90, now);
        gain.gain.setValueAtTime(0.05, now);
        gain.gain.linearRampToValueAtTime(0.001, now + 0.04);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.04);
      }
      playScore() {
        if (this.muted || !this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(523.25, now); // C5
        osc.frequency.setValueAtTime(659.25, now + 0.08); // E5
        gain.gain.setValueAtTime(0.1, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.2);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.2);
      }
      playBarrelRoll() {
        if (this.muted || !this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(75, now);
        osc.frequency.linearRampToValueAtTime(40, now + 0.08);
        gain.gain.setValueAtTime(0.04, now);
        gain.gain.linearRampToValueAtTime(0.001, now + 0.08);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.08);
      }
      playDeath() {
        if (this.muted || !this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(400, now);
        osc.frequency.linearRampToValueAtTime(60, now + 0.6);
        gain.gain.setValueAtTime(0.18, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.6);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.6);
      }
      playWin() {
        if (this.muted || !this.ctx) return;
        const notes = [440, 554, 659, 880];
        notes.forEach((freq, i) => {
          const now = this.ctx.currentTime + (i * 0.12);
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, now);
          gain.gain.setValueAtTime(0.15, now);
          gain.gain.linearRampToValueAtTime(0.01, now + 0.11);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.12);
        });
      }
    }

    const audio = new RetroAudio();

    /* ========================================================================
       CONFIGURACIÓN DEL JUEGO Y VARIABLES DE ESTADO
       ======================================================================== */
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const GAME_WIDTH = 560;
    const GAME_HEIGHT = 640;
    const GRAVITY = 0.38;

    let score = 0;
    let highScore = 10000;
    let bonus = 5000;
    let bonusTimer = 0;
    let lives = 3;
    let level = 1;
    let gameState = 'START'; // 'START', 'PLAYING', 'DEAD', 'WIN', 'GAMEOVER'
    let stateTimer = 0;

    // Control de teclas
    const keys = {
      left: false,
      right: false,
      up: false,
      down: false,
      jump: false,
      jumpHandled: false
    };

    /* ========================================================================
       DEFINICIÓN DEL ESCENARIO (Vigas inclinadas y Escaleras clásicas)
       ======================================================================== */
    // 6 pisos de vigas clásicas inclinadas
    const platforms = [
      // Piso 0 (Suelo base)
      { x1: 20, y1: 615, x2: 540, y2: 615, thickness: 12 },
      // Piso 1 (Inclinado hacia la derecha/arriba)
      { x1: 20, y1: 525, x2: 500, y2: 505, thickness: 10 },
      // Piso 2 (Inclinado hacia la izquierda/arriba)
      { x1: 60, y1: 405, x2: 540, y2: 425, thickness: 10 },
      // Piso 3 (Inclinado hacia la derecha/arriba)
      { x1: 20, y1: 325, x2: 500, y2: 305, thickness: 10 },
      // Piso 4 (Inclinado hacia la izquierda/arriba)
      { x1: 60, y1: 205, x2: 540, y2: 225, thickness: 10 },
      // Piso 5 (Plataforma superior donde está Donkey Kong)
      { x1: 20, y1: 130, x2: 270, y2: 130, thickness: 10 },
      // Plataforma donde está Pauline
      { x1: 210, y1: 75, x2: 350, y2: 75, thickness: 10 }
    ];

    // Escaleras conectando las plataformas
    const ladders = [
      // Del Piso 0 al 1
      { x: 440, yTop: 508, yBottom: 615 },
      // Del Piso 1 al 2
      { x: 100, yTop: 408, yBottom: 521 },
      // Del Piso 2 al 3
      { x: 440, yTop: 308, yBottom: 421 },
      // Del Piso 3 al 4
      { x: 110, yTop: 208, yBottom: 321 },
      // Del Piso 4 a Donkey Kong
      { x: 230, yTop: 130, yBottom: 215 },
      // De DK a Pauline
      { x: 250, yTop: 75, yBottom: 130 }
    ];

    // Función auxiliar para obtener la altura de la plataforma bajo una coordenada X
    function getPlatformUnder(x, y, maxDist = 25) {
      let candidate = null;
      let minDiff = Infinity;

      for (const p of platforms) {
        if (x >= Math.min(p.x1, p.x2) - 8 && x <= Math.max(p.x1, p.x2) + 8) {
          // Ecuación de la recta
          const slope = (p.y2 - p.y1) / (p.x2 - p.x1);
          const platY = p.y1 + slope * (x - p.x1);

          const diff = y - platY;
          // El personaje debe estar ligeramente arriba o sobre la superficie
          if (diff >= -8 && diff <= maxDist) {
            if (Math.abs(diff) < minDiff) {
              minDiff = Math.abs(diff);
              candidate = { y: platY, platform: p };
            }
          }
        }
      }
      return candidate;
    }

    /* ========================================================================
       ENTIDAD: JUMPMAN (Mario)
       ======================================================================== */
    const player = {
      x: 70,
      y: 615,
      width: 22,
      height: 26,
      vx: 0,
      vy: 0,
      speed: 2.2,
      climbSpeed: 1.8,
      isGrounded: true,
      isClimbing: false,
      direction: 1, // 1 = derecha, -1 = izquierda
      animFrame: 0,
      animTimer: 0,
      nearLadder: null,

      reset() {
        this.x = 70;
        this.y = 615;
        this.vx = 0;
        this.vy = 0;
        this.isGrounded = true;
        this.isClimbing = false;
        this.direction = 1;
      },

      update() {
        // Checar si está cerca de alguna escalera
        this.nearLadder = null;
        for (const lad of ladders) {
          if (Math.abs(this.x - lad.x) < 14) {
            // Rango vertical de agarre
            if (this.y >= lad.yTop - 6 && this.y <= lad.yBottom + 6) {
              this.nearLadder = lad;
              break;
            }
          }
        }

        // Entrar o salir del modo trepar
        if (this.nearLadder) {
          if (keys.up) {
            this.isClimbing = true;
            this.x = this.nearLadder.x; // Centrarse en la escalera
            this.vy = -this.climbSpeed;
          } else if (keys.down) {
            this.isClimbing = true;
            this.x = this.nearLadder.x;
            this.vy = this.climbSpeed;
          } else if (this.isClimbing) {
            this.vy = 0;
          }

          // Salir de la escalera por arriba o abajo
          if (this.isClimbing) {
            if (this.y < this.nearLadder.yTop) {
              this.y = this.nearLadder.yTop;
              this.isClimbing = false;
            } else if (this.y > this.nearLadder.yBottom) {
              this.y = this.nearLadder.yBottom;
              this.isClimbing = false;
            }
          }
        } else {
          this.isClimbing = false;
        }

        // Movimiento Horizontal (cuando no se está trepando)
        if (!this.isClimbing) {
          if (keys.left) {
            this.vx = -this.speed;
            this.direction = -1;
            this.animTimer++;
            if (this.animTimer % 8 === 0) audio.playStep();
          } else if (keys.right) {
            this.vx = this.speed;
            this.direction = 1;
            this.animTimer++;
            if (this.animTimer % 8 === 0) audio.playStep();
          } else {
            this.vx = 0;
          }

          // Salto
          if (keys.jump && !keys.jumpHandled && this.isGrounded) {
            this.vy = -7.4;
            this.isGrounded = false;
            keys.jumpHandled = true;
            audio.playJump();
          }

          // Aplicar Gravedad
          this.vy += GRAVITY;

          // Mover horizontalmente
          this.x += this.vx;
          // Límites de pantalla
          if (this.x < 30) this.x = 30;
          if (this.x > GAME_WIDTH - 30) this.x = GAME_WIDTH - 30;

          // Mover verticalmente
          this.y += this.vy;

          // Colisión con plataformas
          const platCheck = getPlatformUnder(this.x, this.y, 16);
          if (platCheck && this.vy >= 0) {
            this.y = platCheck.y;
            this.vy = 0;
            this.isGrounded = true;
          } else {
            this.isGrounded = false;
          }
        } else {
          // Está escalando
          this.y += this.vy;
          this.vx = 0;
          if (this.vy !== 0) {
            this.animTimer++;
            if (this.animTimer % 10 === 0) audio.playStep();
          }
        }

        // Animación al caminar o escalar
        if ((this.vx !== 0 && this.isGrounded) || (this.isClimbing && this.vy !== 0)) {
          this.animFrame = Math.floor(this.animTimer / 6) % 2;
        } else {
          this.animFrame = 0;
        }
      },

      draw() {
        ctx.save();
        ctx.translate(this.x, this.y);

        // Voltear sprite según dirección
        if (this.direction === -1 && !this.isClimbing) {
          ctx.scale(-1, 1);
        }

        if (this.isClimbing) {
          // Dibujar Jumpman de espaldas trepando
          ctx.fillStyle = '#d42a27'; // Traje rojo
          ctx.fillRect(-7, -24, 14, 16);
          ctx.fillStyle = '#0f4ab8'; // Overol azul
          ctx.fillRect(-5, -16, 10, 10);
          ctx.fillStyle = '#fdb88b'; // Cabeza/manos
          ctx.fillRect(this.animFrame ? -9 : -6, -26, 4, 6);
          ctx.fillRect(this.animFrame ? 5 : 2, -26, 4, 6);
          // Gorra
          ctx.fillStyle = '#d42a27';
          ctx.fillRect(-6, -27, 12, 5);
        } else {
          // Sprite pixel-art clásico de Jumpman
          // Gorra y pelo
          ctx.fillStyle = '#5c2d11'; // Cabello
          ctx.fillRect(-6, -24, 5, 5);
          ctx.fillStyle = '#d42a27'; // Gorra Roja
          ctx.fillRect(-7, -26, 14, 4);
          ctx.fillRect(-2, -28, 10, 3);

          // Cara
          ctx.fillStyle = '#fdb88b'; // Piel
          ctx.fillRect(-3, -22, 10, 7);
          ctx.fillStyle = '#000'; // Ojo
          ctx.fillRect(2, -20, 2, 2);
          // Bigote
          ctx.fillStyle = '#5c2d11';
          ctx.fillRect(2, -17, 6, 3);

          // Camisa Roja
          ctx.fillStyle = '#d42a27';
          ctx.fillRect(-6, -15, 12, 8);

          // Brazos / Movimiento
          if (!this.isGrounded) {
            // Brazos arriba al saltar
            ctx.fillStyle = '#d42a27';
            ctx.fillRect(-8, -20, 4, 7);
            ctx.fillStyle = '#fdb88b';
            ctx.fillRect(-8, -23, 4, 4);
          } else {
            // Brazos en carrera
            ctx.fillStyle = '#fdb88b';
            ctx.fillRect(this.animFrame ? 4 : -8, -12, 4, 4);
          }

          // Overol Azul
          ctx.fillStyle = '#0f4ab8';
          ctx.fillRect(-5, -13, 10, 8);
          // Tirantes amarillos
          ctx.fillStyle = '#fcd012';
          ctx.fillRect(-3, -11, 2, 2);
          ctx.fillRect(1, -11, 2, 2);

          // Piernas y Botas
          ctx.fillStyle = '#0f4ab8';
          if (!this.isGrounded) {
            ctx.fillRect(-8, -6, 6, 4);
            ctx.fillRect(2, -6, 6, 4);
            ctx.fillStyle = '#5c2d11';
            ctx.fillRect(-10, -3, 6, 4);
            ctx.fillRect(4, -3, 6, 4);
          } else if (this.animFrame === 1) {
            // Paso abierto
            ctx.fillRect(-8, -6, 5, 4);
            ctx.fillRect(3, -6, 5, 4);
            ctx.fillStyle = '#5c2d11';
            ctx.fillRect(-9, -2, 6, 3);
            ctx.fillRect(4, -2, 6, 3);
          } else {
            // Paso neutral
            ctx.fillRect(-5, -6, 10, 4);
            ctx.fillStyle = '#5c2d11';
            ctx.fillRect(-6, -2, 12, 3);
          }
        }

        ctx.restore();
      }
    };

    /* ========================================================================
       ENTIDAD: DONKEY KONG (El Gran Simio)
       ======================================================================== */
    const donkeyKong = {
      x: 80,
      y: 130,
      chestBeat: false,
      animTimer: 0,
      barrelThrowCooldown: 180,

      update() {
        this.animTimer++;
        if (this.animTimer % 45 === 0) {
          this.chestBeat = !this.chestBeat;
        }

        // Lanzamiento de barriles
        this.barrelThrowCooldown--;
        if (this.barrelThrowCooldown <= 0) {
          spawnBarrel();
          // Variabilidad según nivel
          this.barrelThrowCooldown = Math.max(90, 200 - (level * 20) + Math.floor(Math.random() * 40));
        }
      },

      draw() {
        ctx.save();
        ctx.translate(this.x, this.y);

        // Cuerpo simiesco pelaje marrón oscuro
        ctx.fillStyle = '#61270b';
        ctx.beginPath();
        ctx.ellipse(0, -30, 28, 25, 0, 0, Math.PI * 2);
        ctx.fill();

        // Pecho musculoso marrón claro
        ctx.fillStyle = '#d48039';
        ctx.beginPath();
        ctx.ellipse(0, -25, 16, 15, 0, 0, Math.PI * 2);
        ctx.fill();

        // Brazos / Manos golpeando el pecho o tirando barril
        ctx.fillStyle = '#61270b';
        if (this.chestBeat) {
          ctx.fillRect(-35, -42, 14, 18);
          ctx.fillRect(21, -42, 14, 18);
          ctx.fillStyle = '#d48039';
          ctx.fillRect(-22, -36, 10, 10);
          ctx.fillRect(12, -36, 10, 10);
        } else {
          ctx.fillRect(-38, -25, 14, 25);
          ctx.fillRect(24, -25, 14, 25);
          ctx.fillStyle = '#d48039';
          ctx.fillRect(-36, -5, 12, 10);
          ctx.fillRect(24, -5, 12, 10);
        }

        // Cabeza
        ctx.fillStyle = '#61270b';
        ctx.beginPath();
        ctx.arc(0, -50, 18, 0, Math.PI * 2);
        ctx.fill();

        // Cara y Hocico
        ctx.fillStyle = '#d48039';
        ctx.beginPath();
        ctx.ellipse(0, -46, 13, 10, 0, 0, Math.PI * 2);
        ctx.fill();

        // Ojos
        ctx.fillStyle = '#fff';
        ctx.fillRect(-7, -54, 5, 6);
        ctx.fillRect(2, -54, 5, 6);
        ctx.fillStyle = '#000';
        ctx.fillRect(-5, -52, 3, 4);
        ctx.fillRect(4, -52, 3, 4);

        // Sonrisa feroz / Dientes
        ctx.fillStyle = '#fff';
        ctx.fillRect(-6, -42, 12, 4);
        ctx.fillStyle = '#000';
        ctx.fillRect(-5, -41, 10, 1);

        // Pila de barriles a su izquierda
        ctx.fillStyle = '#9b561c';
        ctx.fillRect(-62, -26, 20, 26);
        ctx.fillStyle = '#3a1f0a';
        ctx.strokeRect(-62, -26, 20, 26);

        ctx.restore();
      }
    };

    /* ========================================================================
       ENTIDAD: PAULINE (Damisela en Apuros)
       ======================================================================== */
    const pauline = {
      x: 280,
      y: 75,
      animTimer: 0,
      draw() {
        this.animTimer++;
        ctx.save();
        ctx.translate(this.x, this.y);

        // Vestido Rosa
        ctx.fillStyle = '#fc6294';
        ctx.beginPath();
        ctx.moveTo(0, -22);
        ctx.lineTo(-8, 0);
        ctx.lineTo(8, 0);
        ctx.closePath();
        ctx.fill();

        // Pelo Castaño / Rubio arcade
        ctx.fillStyle = '#c97e18';
        ctx.fillRect(-7, -32, 14, 10);

        // Cara
        ctx.fillStyle = '#fed6b2';
        ctx.fillRect(-4, -28, 8, 7);

        // Ojos y boca
        ctx.fillStyle = '#000';
        ctx.fillRect(-2, -26, 1, 2);
        ctx.fillRect(1, -26, 1, 2);
        ctx.fillStyle = '#e81414';
        ctx.fillRect(-1, -23, 2, 1);

        // Brazos pidiendo auxilio alternados
        ctx.fillStyle = '#fed6b2';
        if (Math.floor(this.animTimer / 30) % 2 === 0) {
          ctx.fillRect(-12, -25, 4, 10);
          ctx.fillRect(8, -25, 4, 10);
        } else {
          ctx.fillRect(-10, -32, 4, 10);
          ctx.fillRect(6, -32, 4, 10);
        }

        // Bocadillo "HELP!"
        if (Math.floor(this.animTimer / 40) % 2 === 0) {
          ctx.fillStyle = '#fff';
          ctx.fillRect(14, -40, 52, 18);
          ctx.fillStyle = '#000';
          ctx.strokeRect(14, -40, 52, 18);
          ctx.font = '8px "Press Start 2P"';
          ctx.fillStyle = '#ff0033';
          ctx.fillText('HELP!', 18, -27);
        }

        ctx.restore();
      }
    };

    /* ========================================================================
       SISTEMA DE BARRILES RODANTES
       ======================================================================== */
    let barrels = [];

    class Barrel {
      constructor(x, y) {
        this.x = x;
        this.y = y;
        this.radius = 9;
        this.vx = 2.0 + (level * 0.25);
        this.vy = 0;
        this.rotation = 0;
        this.jumped = false; // Bandera para otorgar 100 puntos por salto
        this.isFalling = false;
      }

      update() {
        // Gravedad
        this.vy += GRAVITY;
        this.y += this.vy;
        this.x += this.vx;

        // Comprobar colisión con plataforma
        const pCheck = getPlatformUnder(this.x, this.y, 14);
        if (pCheck && this.vy >= 0) {
          this.y = pCheck.y;
          this.vy = 0;
          this.isFalling = false;

          // La dirección horizontal depende de la inclinación del piso
          // Piso con pendiente hacia la derecha => pCheck.platform.y2 > pCheck.platform.y1 => vx > 0
          const slope = (pCheck.platform.y2 - pCheck.platform.y1) / (pCheck.platform.x2 - pCheck.platform.x1);
          if (slope > 0.005) {
            this.vx = Math.abs(this.vx);
          } else if (slope < -0.005) {
            this.vx = -Math.abs(this.vx);
          }

          // Sonido sutil de rodar
          if (Math.random() < 0.03) {
            audio.playBarrelRoll();
          }
        } else {
          this.isFalling = true;
        }

        // Rebote en bordes o caer a piso inferior
        if (this.x < 25) {
          this.x = 25;
          this.vx = Math.abs(this.vx);
        } else if (this.x > GAME_WIDTH - 25) {
          this.x = GAME_WIDTH - 25;
          this.vx = -Math.abs(this.vx);
        }

        // Rotación gráfica según velocidad
        this.rotation += this.vx * 0.08;
      }

      draw() {
        ctx.save();
        ctx.translate(this.x, this.y - this.radius);
        ctx.rotate(this.rotation);

        // Silueta del Barril (Marrón madera con aros metálicos)
        ctx.fillStyle = '#b35917';
        ctx.beginPath();
        ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.lineWidth = 1.5;
        ctx.strokeStyle = '#2b1202';
        ctx.stroke();

        // Detalles / Refuerzos del barril
        ctx.strokeStyle = '#3a1f0a';
        ctx.beginPath();
        ctx.moveTo(-this.radius + 2, -this.radius / 2);
        ctx.lineTo(this.radius - 2, -this.radius / 2);
        ctx.moveTo(-this.radius + 2, this.radius / 2);
        ctx.lineTo(this.radius - 2, this.radius / 2);
        ctx.stroke();

        // Rayas cruzadas para notar la rotación
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(-this.radius + 3, 0);
        ctx.lineTo(this.radius - 3, 0);
        ctx.stroke();

        ctx.restore();
      }
    }

    function spawnBarrel() {
      // Aparece al lado de Donkey Kong
      barrels.push(new Barrel(donkeyKong.x + 35, donkeyKong.y - 10));
    }

    /* ========================================================================
       TEXTOS FLOTANTES DE PUNTUACIÓN (+100)
       ======================================================================== */
    let floatingTexts = [];
    function addFloatingText(text, x, y, color = '#ffff00') {
      floatingTexts.push({
        text,
        x,
        y,
        color,
        life: 45
      });
    }

    /* ========================================================================
       DIBUJO DE ESCENARIO (Vigas y Escaleras Estilo Arcade Original)
       ======================================================================== */
    function drawScenery() {
      // 1. Dibujar Escaleras
      for (const lad of ladders) {
        ctx.strokeStyle = '#00e1ff';
        ctx.lineWidth = 2.5;

        // Montantes verticales
        ctx.beginPath();
        ctx.moveTo(lad.x - 7, lad.yTop);
        ctx.lineTo(lad.x - 7, lad.yBottom);
        ctx.moveTo(lad.x + 7, lad.yTop);
        ctx.lineTo(lad.x + 7, lad.yBottom);
        ctx.stroke();

        // Peldaños horizontales
        const step = 8;
        for (let y = lad.yTop + 4; y < lad.yBottom; y += step) {
          ctx.beginPath();
          ctx.moveTo(lad.x - 7, y);
          ctx.lineTo(lad.x + 7, y);
          ctx.stroke();
        }
      }

      // 2. Dibujar Vigas Rojas de Construcción (Girders)
      for (const p of platforms) {
        ctx.strokeStyle = '#e62434'; // Rojo Arcade
        ctx.fillStyle = '#b31522';
        ctx.lineWidth = 3;

        // Viga superior e inferior
        ctx.beginPath();
        ctx.moveTo(p.x1, p.y1);
        ctx.lineTo(p.x2, p.y2);
        ctx.moveTo(p.x1, p.y1 + p.thickness);
        ctx.lineTo(p.x2, p.y2 + p.thickness);
        ctx.stroke();

        // Patrón en celosía 'X' en el interior de la viga
        const dx = p.x2 - p.x1;
        const dy = p.y2 - p.y1;
        const length = Math.hypot(dx, dy);
        const segments = Math.floor(length / 14);

        ctx.lineWidth = 1.2;
        for (let i = 0; i < segments; i++) {
          const t1 = i / segments;
          const t2 = (i + 1) / segments;
          const sx1 = p.x1 + dx * t1;
          const sy1 = p.y1 + dy * t1;
          const sx2 = p.x1 + dx * t2;
          const sy2 = p.y2 + dy * t2;

          ctx.beginPath();
          ctx.moveTo(sx1, sy1);
          ctx.lineTo(sx2, sy2 + p.thickness);
          ctx.moveTo(sx2, sy2);
          ctx.lineTo(sx1, sy1 + p.thickness);
          ctx.stroke();
        }
      }

      // Barril de petróleo ardiente en la base izquierda (Obstáculo visual)
      ctx.fillStyle = '#1e389e';
      ctx.fillRect(30, 570, 24, 45);
      ctx.fillStyle = '#3a66ff';
      ctx.fillRect(32, 575, 20, 5);
      ctx.fillRect(32, 595, 20, 5);

      // Llamas animadas del barril
      const flameH = 8 + Math.sin(Date.now() / 90) * 5;
      ctx.fillStyle = '#ff7b00';
      ctx.beginPath();
      ctx.moveTo(32, 570);
      ctx.lineTo(42, 570 - flameH);
      ctx.lineTo(52, 570);
      ctx.fill();
    }

    /* ========================================================================
       LÓGICA DE ACTUALIZACIÓN DEL JUEGO
       ======================================================================== */
    function updateGame() {
      if (gameState !== 'PLAYING') {
        if (gameState === 'DEAD' || gameState === 'WIN') {
          stateTimer--;
          if (stateTimer <= 0) {
            if (gameState === 'WIN') {
              // Avanzar nivel
              level++;
              bonus = 5000 + (level * 500);
              barrels = [];
              player.reset();
              gameState = 'PLAYING';
            } else if (gameState === 'DEAD') {
              lives--;
              if (lives <= 0) {
                gameState = 'GAMEOVER';
                showModal('GAME OVER', '¡Donkey Kong ha ganado esta vez!', 'REINTENTAR');
              } else {
                barrels = [];
                player.reset();
                gameState = 'PLAYING';
              }
            }
            updateHUD();
          }
        }
        return;
      }

      // 1. Contador Bonus decreciente
      bonusTimer++;
      if (bonusTimer >= 40) {
        bonusTimer = 0;
        if (bonus > 0) bonus = Math.max(0, bonus - 100);
        document.getElementById('bonusDisplay').innerText = bonus.toString().padStart(4, '0');
        if (bonus === 0) {
          // Si el tiempo expira, Jumpman pierde
          triggerDeath();
          return;
        }
      }

      // 2. Actualizar Entidades
      player.update();
      donkeyKong.update();

      // 3. Actualizar Barriles
      for (let i = barrels.length - 1; i >= 0; i--) {
        const b = barrels[i];
        b.update();

        // Si el barril cae al vacío o llega al fuego inferior
        if (b.y > 630 || (b.x < 60 && b.y > 580)) {
          barrels.splice(i, 1);
          continue;
        }

        // Detección de salto exitoso sobre barril (+100 PUNTOS)
        // Jumpman debe estar encima, cayendo o saltando, y cerca en X
        if (!b.jumped && !player.isGrounded && Math.abs(player.x - b.x) < 20 && (player.y < b.y - b.radius) && (player.y > b.y - 45)) {
          b.jumped = true;
          score += 100;
          addFloatingText('100', b.x, b.y - 20, '#ffff00');
          audio.playScore();
          updateHUD();
        }

        // Colisión fatal con Jumpman (Caja delimitadora circular/elíptica)
        const dist = Math.hypot(player.x - b.x, (player.y - 12) - (b.y - b.radius));
        if (dist < 16) {
          triggerDeath();
          return;
        }
      }

      // 4. Comprobar victoria: Jumpman alcanza la plataforma de Pauline
      if (player.y <= pauline.y + 12 && player.x >= 210 && player.x <= 350) {
        triggerWin();
      }

      // 5. Actualizar textos flotantes
      for (let i = floatingTexts.length - 1; i >= 0; i--) {
        const ft = floatingTexts[i];
        ft.y -= 0.6;
        ft.life--;
        if (ft.life <= 0) floatingTexts.splice(i, 1);
      }
    }

    function triggerDeath() {
      gameState = 'DEAD';
      stateTimer = 60; // 1 segundo
      audio.playDeath();
    }

    function triggerWin() {
      gameState = 'WIN';
      stateTimer = 90; // 1.5 segundos
      score += bonus;
      addFloatingText(`+${bonus}`, pauline.x, pauline.y - 20, '#00ffff');
      audio.playWin();
      updateHUD();
    }

    function updateHUD() {
      if (score > highScore) highScore = score;
      document.getElementById('scoreDisplay').innerText = score.toString().padStart(6, '0');
      document.getElementById('highScoreDisplay').innerText = highScore.toString().padStart(6, '0');
      document.getElementById('bonusDisplay').innerText = bonus.toString().padStart(4, '0');
      document.getElementById('levelDisplay').innerText = level;

      // Vidas
      let hearts = '';
      for (let i = 0; i < lives; i++) hearts += '❤️';
      document.getElementById('livesContainer').innerText = hearts || '💀';
    }

    /* ========================================================================
       RENDERIZADO PRINCIPAL (Canvas Frame)
       ======================================================================== */
    function render() {
      // Limpiar fondo
      ctx.fillStyle = '#000000';
      ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

      // Dibujar estructura metálica del nivel
      drawScenery();

      // Dibujar Personajes
      donkeyKong.draw();
      pauline.draw();

      // Dibujar Barriles
      for (const b of barrels) {
        b.draw();
      }

      // Dibujar Jugador
      if (gameState === 'DEAD') {
        // Efecto parpadeo / muerte
        if (Math.floor(Date.now() / 80) % 2 === 0) {
          player.draw();
        }
      } else {
        player.draw();
      }

      // Dibujar textos flotantes
      for (const ft of floatingTexts) {
        ctx.fillStyle = ft.color;
        ctx.font = '10px "Press Start 2P"';
        ctx.fillText(ft.text, ft.x, ft.y);
      }

      // Si gana la pantalla, cartel de corazón
      if (gameState === 'WIN') {
        ctx.fillStyle = '#ff2b75';
        ctx.font = '16px "Press Start 2P"';
        ctx.textAlign = 'center';
        ctx.fillText('❤️ ¡RESCATADA! ❤️', GAME_WIDTH / 2, 280);
        ctx.textAlign = 'start';
      }
    }

    /* ========================================================================
       BUCLE PRINCIPAL DEL JUEGO (Game Loop a 60 FPS)
       ======================================================================== */
    function gameLoop() {
      updateGame();
      render();
      requestAnimationFrame(gameLoop);
    }

    /* ========================================================================
       GESTIÓN DEL MODAL Y CONTROL DE ESTADOS
       ======================================================================== */
    const modalOverlay = document.getElementById('modalOverlay');
    const modalTitle = document.getElementById('modalTitle');
    const modalSubtitle = document.getElementById('modalSubtitle');
    const startBtn = document.getElementById('startBtn');

    function showModal(title, subtitle, btnText) {
      modalTitle.innerText = title;
      modalSubtitle.innerHTML = subtitle;
      startBtn.innerText = btnText;
      modalOverlay.classList.remove('hidden');
    }

    function hideModal() {
      modalOverlay.classList.add('hidden');
    }

    function startNewGame() {
      audio.init();
      score = 0;
      lives = 3;
      level = 1;
      bonus = 5000;
      bonusTimer = 0;
      barrels = [];
      player.reset();
      updateHUD();
      hideModal();
      gameState = 'PLAYING';
    }

    startBtn.addEventListener('click', () => {
      startNewGame();
    });

    // Control de audio mute
    const soundToggle = document.getElementById('soundToggle');
    const soundStatusText = document.getElementById('soundStatusText');
    soundToggle.addEventListener('click', () => {
      audio.init();
      audio.muted = !audio.muted;
      soundStatusText.innerText = audio.muted ? 'OFF' : 'ON';
      soundStatusText.className = audio.muted ? 'text-red-400' : 'text-green-400 font-bold';
    });

    /* ========================================================================
       ENTRADAS DE TECLADO (PC)
       ======================================================================== */
    window.addEventListener('keydown', (e) => {
      audio.init();
      if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].includes(e.key)) {
        e.preventDefault(); // Evitar scroll en la página
      }

      if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = true;
      if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = true;
      if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') keys.up = true;
      if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') keys.down = true;
      if (e.key === ' ' || e.key === 'Spacebar') keys.jump = true;
    });

    window.addEventListener('keyup', (e) => {
      if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = false;
      if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = false;
      if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') keys.up = false;
      if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') keys.down = false;
      if (e.key === ' ' || e.key === 'Spacebar') {
        keys.jump = false;
        keys.jumpHandled = false;
      }
    });

    /* ========================================================================
       CONTROLES TÁCTILES (Móviles y Tablets)
       ======================================================================== */
    function attachTouch(elemId, onPress, onRelease) {
      const el = document.getElementById(elemId);
      if (!el) return;

      const start = (e) => {
        e.preventDefault();
        audio.init();
        onPress();
      };
      const end = (e) => {
        e.preventDefault();
        onRelease();
      };

      el.addEventListener('touchstart', start, { passive: false });
      el.addEventListener('touchend', end, { passive: false });
      el.addEventListener('mousedown', start);
      el.addEventListener('mouseup', end);
      el.addEventListener('mouseleave', end);
    }

    attachTouch('btnLeft', () => { keys.left = true; }, () => { keys.left = false; });
    attachTouch('btnRight', () => { keys.right = true; }, () => { keys.right = false; });
    attachTouch('btnUp', () => { keys.up = true; }, () => { keys.up = false; });
    attachTouch('btnDown', () => { keys.down = true; }, () => { keys.down = false; });
    attachTouch('btnJump', () => { keys.jump = true; }, () => { keys.jump = false; keys.jumpHandled = false; });

    /* ========================================================================
       INICIALIZACIÓN AL CARGAR LA VENTANA
       ======================================================================== */
    window.onload = function() {
      updateHUD();
      gameLoop();
    };
  </script>
</body>
